name: Processar BDGD

on:
  workflow_dispatch:
    inputs:
      dataset_id:
        description: 'ArcGIS Online item ID (arcgis.com/home/item.html?id=...)'
        required: true
        default: '8eaa712a707745adac9948b24e188bd9'
      prefixo:
        description: 'Prefixo dos arquivos de saida (ex: elektro_2024)'
        required: true
        default: 'elektro_2024'
      tag:
        description: 'Tag do Release (ex: bdgd-elektro-2024)'
        required: true
        default: 'bdgd-elektro-2024'
      camadas:
        description: 'Camadas a processar separadas por virgula'
        required: false
        default: 'SSDMT,UNTRMT'

jobs:
  processar:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gdal-bin tippecanoe unzip python3 python3-gdal
          echo "GDAL $(ogr2ogr --version)"
          echo "tippecanoe $(tippecanoe --version)"

      - name: Baixar BDGD do ArcGIS Online
        run: |
          echo "Baixando item ${{ inputs.dataset_id }} (~1.4 GB)..."
          curl -L \
            --retry 3 \
            --retry-delay 30 \
            --connect-timeout 60 \
            --max-time 3600 \
            -H "Referer: https://www.arcgis.com/" \
            --fail \
            -o bdgd.gdb.zip \
            "https://www.arcgis.com/sharing/rest/content/items/${{ inputs.dataset_id }}/data"
          ls -lh bdgd.gdb.zip

      - name: Extrair GDB
        run: |
          unzip -q bdgd.gdb.zip
          GDB=$(find . -maxdepth 2 -name "*.gdb" -type d | head -1)
          echo "GDB=$GDB" >> $GITHUB_ENV
          echo "GDB encontrado: $GDB"
          echo "Camadas disponiveis:"
          ogrinfo -al -so "$GDB" 2>/dev/null | grep "^Layer name:" | awk '{print "  -", $NF}' || true

      - name: Converter camadas
        run: |
          mkdir -p out
          IFS=',' read -ra CAMADAS <<< "${{ inputs.camadas }}"
          for CAMADA in "${CAMADAS[@]}"; do
            CAMADA=$(echo "$CAMADA" | tr -d ' ')
            echo ""
            echo "=== $CAMADA ==="
            case "$CAMADA" in
              SSDMT)
                TMP="out/ssdmt_tmp.geojson"
                OUT="out/${{ inputs.prefixo }}-rede-mt.pmtiles"
                echo "Convertendo SSDMT para GeoJSON intermediario..."
                # Converte sem expandir domínios — faremos a expansão em Python abaixo,
                # pois OGR_FGDB_RESOLVE_CODED_DOMAINS só funciona no GDAL >= 3.6 com
                # o driver OpenFileGDB, e o comportamento varia por versão do runner.
                ogr2ogr \
                  -t_srs EPSG:4326 -f GeoJSON -lco RFC7946=YES \
                  "$TMP" "$GDB" SSDMT 2>/dev/null
                ls -lh "$TMP"
                echo "Diagnosticando TIP_CND via ogrinfo + Python GDAL..."
                python3 -I - "$GDB" "$TMP" << 'PYEOF'
          import json, sys, subprocess
          from osgeo import ogr

          gdb, geojson_path = sys.argv[1], sys.argv[2]
          domain_map = {}

          # --- PARTE A: schema + feature direta via Python GDAL ---
          try:
              ds = ogr.Open(gdb)
              layer = ds.GetLayerByName("SSDMT") if ds else None
              if layer:
                  defn = layer.GetLayerDefn()
                  # Campos com domínio
                  for i in range(defn.GetFieldCount()):
                      fld = defn.GetFieldDefn(i)
                      try:
                          dn = fld.GetDomainName()
                          if dn:
                              print(f"Campo {fld.GetName()} → domínio={dn!r}")
                      except Exception:
                          pass
                  # Valor real de uma feature
                  feat = layer.GetNextFeature()
                  if feat:
                      for campo in ["TIP_CND", "CRS_CND", "TEN_OPE"]:
                          try:
                              print(f"GetField({campo!r}) = {feat.GetField(campo)!r}")
                          except Exception as ex:
                              print(f"GetField({campo!r}) falhou: {ex}")
                  # GetFieldDomain para TIP_CND
                  for i in range(defn.GetFieldCount()):
                      fld = defn.GetFieldDefn(i)
                      if fld.GetName() == "TIP_CND":
                          try:
                              dname = fld.GetDomainName()
                              print(f"TIP_CND domainName={dname!r}")
                              if dname:
                                  dom = ds.GetFieldDomain(dname)
                                  if dom:
                                      enum = dom.GetEnumeration()
                                      if isinstance(enum, dict):
                                          domain_map = {str(k): str(v) for k, v in enum.items()}
                                      else:
                                          print(f"GetEnumeration() = {type(enum).__name__}: {enum!r}")
                                  else:
                                      print(f"GetFieldDomain({dname!r}) → None")
                          except AttributeError as e:
                              print(f"GetFieldDomain indisponível: {e}")
                          break
              if ds: ds = None
          except Exception as e:
              import traceback; traceback.print_exc()

          # --- PARTE B: lista layers do GDB + tenta GDB_Items (domínios como XML) ---
          try:
              ds2 = ogr.Open(gdb)
              if ds2:
                  n = ds2.GetLayerCount()
                  names = [ds2.GetLayerByIndex(i).GetName() for i in range(n)]
                  print(f"Layers no GDB ({n}): {names}")
                  # Tenta ler GDB_Items — onde ESRI armazena domínios como XML
                  items_lyr = ds2.GetLayerByName("GDB_Items")
                  if items_lyr:
                      print("GDB_Items encontrado — procurando domínios TIP_CND...")
                      for feat in items_lyr:
                          try:
                              name = str(feat.GetField("Name") or "")
                              defn = str(feat.GetField("Definition") or "")
                              if "TIP_CND" in defn or "TIP_CND" in name:
                                  print(f"  Item={name!r}  Defn[:500]={defn[:500]!r}")
                          except Exception:
                              pass
                  else:
                      print("GDB_Items não acessível via OpenFileGDB")
                  ds2 = None
          except Exception as e:
              import traceback; traceback.print_exc()

          # --- PARTE B2: ogrinfo -so (só schema) para ver fields reais ---
          print("--- ogrinfo schema SSDMT ---")
          try:
              r = subprocess.run(
                  ["ogrinfo", "-ro", "-nomd", "-so", gdb, "SSDMT"],
                  capture_output=True, text=True, timeout=60
              )
              # Imprime tudo (schema é pequeno)
              for line in (r.stdout + r.stderr).splitlines()[:60]:
                  print(f"  {line}")
          except Exception as e:
              print(f"ogrinfo -so falhou: {e}")

          # --- PARTE C: valores únicos TIP_CND no GeoJSON já gerado ---
          with open(geojson_path) as f:
              fc = json.load(f)
          geojson_unicos = sorted({str(ft["properties"].get("TIP_CND",""))
                                   for ft in fc.get("features",[])[:2000]
                                   if ft.get("properties",{}).get("TIP_CND") is not None})
          print(f"Valores únicos TIP_CND no GeoJSON (amostra 2000): {geojson_unicos}")

          # --- PARTE D: aplica domain_map se encontrado ---
          if domain_map:
              print(f"Domínio encontrado: {len(domain_map)} entradas")
              for k, v in list(domain_map.items())[:5]:
                  print(f"  {k!r} → {v!r}")
              expanded = 0
              for feat in fc.get("features", []):
                  props = feat.get("properties") or {}
                  raw = str(props.get("TIP_CND", ""))
                  if raw in domain_map:
                      props["TIP_CND"] = domain_map[raw]
                      expanded += 1
              with open(geojson_path, "w") as f:
                  json.dump(fc, f, separators=(",", ":"))
              print(f"TIP_CND expandido em {expanded}/{len(fc['features'])} features")
          else:
              print("domain_map vazio — TIP_CND permanece como código numérico no PMTiles")

          print("Amostra final:")
          for feat in fc["features"][:3]:
              p = feat["properties"]
              print(f"  TIP_CND={p.get('TIP_CND')!r}  CTMT={p.get('CTMT')!r}")
          PYEOF
                echo "Gerando PMTiles..."
                tippecanoe --output="$OUT" --minimum-zoom=11 --maximum-zoom=16 \
                    --simplification=10 --drop-densest-as-needed \
                    --extend-zooms-if-still-dropping \
                    --force --read-parallel -l rede_mt "$TMP"
                ls -lh "$OUT"
                ;;
              SSDBT)
                OUT="out/${{ inputs.prefixo }}-rede-bt.pmtiles"
                ogr2ogr -t_srs EPSG:4326 -f GeoJSON -lco RFC7946=YES /vsistdout/ "$GDB" SSDBT 2>/dev/null \
                | tippecanoe --output="$OUT" --minimum-zoom=13 --maximum-zoom=16 \
                    --simplification=5 --drop-densest-as-needed \
                    --force --read-parallel -l rede_bt /dev/stdin
                ls -lh "$OUT"
                ;;
              UNTRMT)
                OUT="out/${{ inputs.prefixo }}-trafos.geojson"
                ogr2ogr -t_srs EPSG:4326 -f GeoJSON -lco RFC7946=YES "$OUT" "$GDB" UNTRMT 2>/dev/null
                python3 -c "import json; d=json.load(open('$OUT')); print(str(len(d.get('features',[]))) + ' transformadores')"
                ls -lh "$OUT"
                ;;
              PONNOT)
                TMP="out/${{ inputs.prefixo }}-postes.geojson"
                ogr2ogr -t_srs EPSG:4326 -f GeoJSON -lco RFC7946=YES "$TMP" "$GDB" PONNOT 2>/dev/null
                echo "Diagnosticando e expandindo domínios PONNOT..."
                python3 - "$TMP" << 'PYEOF'
          import json, sys

          geojson_path = sys.argv[1]
          with open(geojson_path) as f:
              fc = json.load(f)

          total = len(fc.get("features", []))
          print(f"PONNOT: {total} features")

          if total > 0:
              p0 = fc["features"][0].get("properties", {})
              print(f"Campos disponíveis: {list(p0.keys())}")
              for feat in fc["features"][:3]:
                  p = feat["properties"]
                  print(f"  TIP_EST={p.get('TIP_EST')!r}  ALT_EST={p.get('ALT_EST')!r}  TIP_OPE={p.get('TIP_OPE')!r}  CTMT={p.get('CTMT')!r}")

          # Mapas de domínio ANEEL PONNOT módulo 10 — valores padronizados 1–4
          TIP_EST_MAP = {"1": "Madeira", "2": "Concreto", "3": "Metalico", "4": "Fibra"}
          TIP_OPE_MAP = {"1": "Derivacao", "2": "Passagem", "3": "Termino", "4": "Ancoragem"}

          expanded_est, expanded_ope = 0, 0
          for feat in fc.get("features", []):
              props = feat.get("properties") or {}
              v = props.get("TIP_EST")
              if v is not None:
                  mapped = TIP_EST_MAP.get(str(v))
                  if mapped:
                      props["TIP_EST"] = mapped
                      expanded_est += 1
              v = props.get("TIP_OPE")
              if v is not None:
                  mapped = TIP_OPE_MAP.get(str(v))
                  if mapped:
                      props["TIP_OPE"] = mapped
                      expanded_ope += 1

          with open(geojson_path, "w") as f:
              json.dump(fc, f, separators=(",", ":"))
          print(f"TIP_EST expandido: {expanded_est}  |  TIP_OPE expandido: {expanded_ope}")

          if total > 0:
              for feat in fc["features"][:2]:
                  p = feat["properties"]
                  print(f"  → TIP_EST={p.get('TIP_EST')!r}  ALT_EST={p.get('ALT_EST')!r}  TIP_OPE={p.get('TIP_OPE')!r}")
          PYEOF
                SIZE=$(stat -c%s "$TMP")
                if [ "$SIZE" -gt 30000000 ]; then
                  OUT="out/${{ inputs.prefixo }}-postes.pmtiles"
                  tippecanoe --output="$OUT" --minimum-zoom=13 --maximum-zoom=16 --force -l postes "$TMP"
                  rm "$TMP"
                  ls -lh "$OUT"
                else
                  ls -lh "$TMP"
                fi
                ;;
              *)
                echo "Camada $CAMADA nao reconhecida, pulando."
                ;;
            esac
          done
          echo ""
          echo "Arquivos gerados ate agora:"
          ls -lh out/

      - name: Gerar linhas por CTMT
        run: |
          if [ ! -f "out/ssdmt_tmp.geojson" ]; then
            echo "ssdmt_tmp.geojson nao encontrado, pulando split por CTMT."
            exit 0
          fi
          echo "Dividindo SSDMT por CTMT..."
          python3 - << 'PYEOF'
          import json
          from collections import defaultdict

          with open("out/ssdmt_tmp.geojson") as f:
              fc = json.load(f)

          total = len(fc.get("features", []))
          print(f"Total de segmentos SSDMT: {total}")

          by_ctmt = defaultdict(list)
          sem_ctmt = 0
          for feat in fc.get("features", []):
              props = feat.get("properties") or {}
              ctmt = props.get("CTMT") or props.get("COD_CTMT") or ""
              if ctmt:
                  feat["properties"] = {
                      "COD_ID": props.get("COD_ID", ""),
                      "CTMT": ctmt,
                      "COMP_3": props.get("COMP_3", None)
                  }
                  by_ctmt[ctmt].append(feat)
              else:
                  sem_ctmt += 1

          print(f"Segmentos sem CTMT: {sem_ctmt}")
          print(f"CTMTs encontrados: {len(by_ctmt)}")

          for ctmt, feats in by_ctmt.items():
              out_fc = {"type": "FeatureCollection", "features": feats}
              with open(f"out/linhas-{ctmt}.geojson", "w") as f:
                  json.dump(out_fc, f, separators=(",", ":"))

          print(f"Arquivos linhas-*.geojson gerados: {len(by_ctmt)}")
          PYEOF
          rm -f out/ssdmt_tmp.geojson
          echo "Total de arquivos linhas-*.geojson: $(ls out/linhas-*.geojson 2>/dev/null | wc -l)"

      - name: Gerar index.json
        run: |
          cd out
          DIST=$(echo "${{ inputs.prefixo }}" | sed 's/_[0-9]*$//')
          python3 - "$DIST" << 'PYEOF'
          import json, os, re, sys
          from collections import defaultdict

          dist_id = sys.argv[1]
          ctmts = [f.replace("linhas-","").replace(".geojson","")
                   for f in os.listdir(".") if f.startswith("linhas-")]

          if not ctmts:
              print("Nenhum arquivo linhas-*.geojson encontrado, pulando index.json.")
              sys.exit(0)

          index = defaultdict(list)
          for ctmt in sorted(ctmts):
              if "_" in ctmt:
                  sub = ctmt.split("_")[0]
              else:
                  m = re.match(r"^[A-Z]+", ctmt)
                  sub = m.group() if m else ctmt
              index[sub].append(ctmt)

          with open("index.json", "w") as f:
              json.dump({"distribuidora": dist_id, "alimentadores": dict(index)}, f)

          total = sum(len(v) for v in index.values())
          print(f"index.json: {total} CTMTs em {len(index)} subestacoes")
          PYEOF
          ls -lh index.json 2>/dev/null || true

      - name: Gerar trafos por CTMT
        run: |
          TRAFOS="out/${{ inputs.prefixo }}-trafos.geojson"
          if [ ! -f "$TRAFOS" ]; then
            echo "trafos.geojson nao encontrado, pulando split por CTMT."
            exit 0
          fi
          echo "Dividindo trafos por CTMT..."
          python3 - "$TRAFOS" << 'PYEOF'
          import json, sys
          from collections import defaultdict

          trafos_path = sys.argv[1]
          with open(trafos_path) as f:
              fc = json.load(f)

          total = len(fc.get("features", []))
          print(f"Total de transformadores: {total}")

          by_ctmt = defaultdict(list)
          sem_ctmt = 0
          for feat in fc.get("features", []):
              props = feat.get("properties") or {}
              ctmt = props.get("CTMT") or props.get("COD_CTMT") or ""
              if ctmt:
                  by_ctmt[ctmt].append(feat)
              else:
                  sem_ctmt += 1

          print(f"Transformadores sem CTMT: {sem_ctmt}")
          print(f"CTMTs encontrados: {len(by_ctmt)}")

          for ctmt, feats in by_ctmt.items():
              out_fc = {"type": "FeatureCollection", "features": feats}
              with open(f"out/trafos-{ctmt}.geojson", "w") as f:
                  json.dump(out_fc, f, separators=(",", ":"))

          print(f"Arquivos trafos-*.geojson gerados: {len(by_ctmt)}")
          PYEOF
          echo "Total de arquivos trafos-*.geojson: $(ls out/trafos-*.geojson 2>/dev/null | wc -l)"

      - name: Liberar espaco
        run: |
          rm -rf bdgd.gdb.zip "$GDB"
          rm -f out/ssdmt_tmp.geojson
          df -h .

      - name: Publicar arquivos principais no Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: "BDGD ${{ inputs.prefixo }}"
          body: |
            Dados BDGD (ANEEL) processados automaticamente.
            Dataset: ${{ inputs.dataset_id }}
            Camadas: ${{ inputs.camadas }}
            Run: ${{ github.run_id }}
            Para usar no Markfield: copie as URLs abaixo e cole em src/map/bdgd.ts
          files: |
            out/*.pmtiles
            out/*-trafos.geojson
            out/*-postes.geojson
            out/index.json
          make_latest: false
          fail_on_unmatched_files: false

      - name: Upload linhas por CTMT
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TOTAL=$(ls out/linhas-*.geojson 2>/dev/null | wc -l)
          if [ "$TOTAL" -eq 0 ]; then
            echo "Nenhum arquivo linhas-*.geojson para upload."
            exit 0
          fi
          echo "Fazendo upload de $TOTAL arquivos linhas-* em lotes de 50..."
          COUNT=0
          FAILURES=0
          for f in out/linhas-*.geojson; do
            [ -f "$f" ] || continue
            if gh release upload "${{ inputs.tag }}" "$f" --clobber 2>&1; then
              COUNT=$((COUNT + 1))
            else
              echo "AVISO: falha em $f, tentando novamente..."
              sleep 10
              if gh release upload "${{ inputs.tag }}" "$f" --clobber 2>&1; then
                COUNT=$((COUNT + 1))
              else
                echo "ERRO: $f nao enviado."
                FAILURES=$((FAILURES + 1))
              fi
            fi
            if [ $(( (COUNT + FAILURES) % 50)) -eq 0 ]; then
              echo "[$((COUNT + FAILURES))/$TOTAL] Pausa 60s para evitar rate limit..."
              sleep 60
            fi
          done
          echo "Upload linhas: $COUNT ok, $FAILURES falhas."
          [ "$FAILURES" -eq 0 ] || echo "AVISO: $FAILURES arquivo(s) nao enviado(s), serao retentados na proxima execucao."

      - name: Publicar release trafos por CTMT
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}-trafos
          name: "BDGD ${{ inputs.prefixo }} — trafos por CTMT"
          body: |
            Transformadores por CTMT (release auxiliar).
            Release principal: ${{ inputs.tag }}
            Run: ${{ github.run_id }}
          make_latest: false
          fail_on_unmatched_files: false

      - name: Upload trafos por CTMT
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TOTAL=$(ls out/trafos-*.geojson 2>/dev/null | wc -l)
          if [ "$TOTAL" -eq 0 ]; then
            echo "Nenhum arquivo trafos-*.geojson para upload."
            exit 0
          fi
          echo "Fazendo upload de $TOTAL arquivos trafos-* em lotes de 50..."
          COUNT=0
          FAILURES=0
          for f in out/trafos-*.geojson; do
            [ -f "$f" ] || continue
            if gh release upload "${{ inputs.tag }}-trafos" "$f" --clobber 2>&1; then
              COUNT=$((COUNT + 1))
            else
              echo "AVISO: falha em $f, tentando novamente..."
              sleep 10
              if gh release upload "${{ inputs.tag }}-trafos" "$f" --clobber 2>&1; then
                COUNT=$((COUNT + 1))
              else
                echo "ERRO: $f nao enviado."
                FAILURES=$((FAILURES + 1))
              fi
            fi
            if [ $(( (COUNT + FAILURES) % 50)) -eq 0 ]; then
              echo "[$((COUNT + FAILURES))/$TOTAL] Pausa 60s para evitar rate limit..."
              sleep 60
            fi
          done
          echo "Upload trafos: $COUNT ok, $FAILURES falhas."
          [ "$FAILURES" -eq 0 ] || echo "AVISO: $FAILURES arquivo(s) nao enviado(s), serao retentados na proxima execucao."
