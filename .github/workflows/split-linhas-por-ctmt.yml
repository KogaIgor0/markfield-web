name: Split Linhas por CTMT

on:
  workflow_dispatch:
    inputs:
      dataset_id:
        description: 'ArcGIS Online item ID (arcgis.com/home/item.html?id=...)'
        required: true
      prefixo:
        description: 'Prefixo dos arquivos (ex: cemig_2024)'
        required: true
      tag:
        description: 'Tag do Release principal (ex: bdgd-cemig-2024)'
        required: true

jobs:
  split:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gdal-bin sqlite3 unzip python3
          echo "GDAL $(ogr2ogr --version)"

      - name: Baixar BDGD do ArcGIS Online
        run: |
          echo "Baixando item ${{ inputs.dataset_id }}..."
          curl -L \
            --retry 3 \
            --retry-delay 30 \
            --connect-timeout 60 \
            --max-time 3600 \
            -H "Referer: https://www.arcgis.com/" \
            --fail \
            -o bdgd.gdb.zip \
            "https://www.arcgis.com/sharing/rest/content/items/${{ inputs.dataset_id }}/data"
          ls -lh bdgd.gdb.zip

      - name: Extrair GDB e converter SSDMT para GeoPackage
        run: |
          unzip -q bdgd.gdb.zip
          GDB=$(find . -maxdepth 2 -name "*.gdb" -type d | head -1)
          echo "GDB: $GDB"
          df -h .

          mkdir -p out
          echo "Convertendo SSDMT para GeoPackage (eficiente em memoria)..."
          ogr2ogr -t_srs EPSG:4326 -f GPKG out/ssdmt.gpkg "$GDB" SSDMT 2>/dev/null
          ls -lh out/ssdmt.gpkg

          rm -rf bdgd.gdb.zip "$GDB"
          df -h .

      - name: Dividir por CTMT
        run: |
          TABLE=$(sqlite3 out/ssdmt.gpkg \
            "SELECT name FROM sqlite_master WHERE type='table' AND lower(name) LIKE '%ssdmt%' LIMIT 1;" \
            2>/dev/null)
          if [ -z "$TABLE" ]; then
            echo "Tabela SSDMT nao encontrada. Tabelas no GPKG:"
            sqlite3 out/ssdmt.gpkg ".tables" 2>/dev/null || true
            TABLE=$(sqlite3 out/ssdmt.gpkg \
              "SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'gpkg_%' AND name NOT LIKE 'rtree_%' AND name NOT LIKE 'sqlite_%' LIMIT 1;" \
              2>/dev/null)
            echo "Usando tabela: $TABLE"
          fi
          if [ -z "$TABLE" ]; then
            echo "ERRO: Nenhuma tabela encontrada no GPKG."
            exit 1
          fi
          echo "Tabela: $TABLE"

          CTMT_COL=$(sqlite3 out/ssdmt.gpkg \
            "SELECT name FROM pragma_table_info('$TABLE') WHERE lower(name) IN ('ctmt','cod_ctmt') ORDER BY CASE lower(name) WHEN 'ctmt' THEN 0 ELSE 1 END LIMIT 1;" \
            2>/dev/null)
          if [ -z "$CTMT_COL" ]; then
            echo "ERRO: Coluna CTMT/COD_CTMT nao encontrada. Colunas disponiveis:"
            sqlite3 out/ssdmt.gpkg "PRAGMA table_info('$TABLE');" 2>/dev/null | awk -F'|' '{print $2}' || true
            exit 1
          fi
          echo "Coluna CTMT: $CTMT_COL"

          sqlite3 out/ssdmt.gpkg \
            "CREATE INDEX IF NOT EXISTS idx_ctmt ON \"$TABLE\"(\"$CTMT_COL\");" 2>/dev/null || true

          sqlite3 out/ssdmt.gpkg \
            "SELECT DISTINCT \"$CTMT_COL\" FROM \"$TABLE\" WHERE \"$CTMT_COL\" IS NOT NULL AND \"$CTMT_COL\" != '' ORDER BY \"$CTMT_COL\";" \
            > out/ctmts.txt 2>/dev/null
          TOTAL_CTMT=$(wc -l < out/ctmts.txt)
          echo "CTMTs encontrados: $TOTAL_CTMT"

          if [ "$TOTAL_CTMT" -eq 0 ]; then
            echo "AVISO: Nenhum CTMT encontrado."
            exit 1
          fi

          COUNT=0
          while IFS= read -r ctmt; do
            [ -z "$ctmt" ] && continue
            safe_ctmt=$(printf '%s' "$ctmt" | tr -dc 'a-zA-Z0-9_-')
            [ -z "$safe_ctmt" ] && safe_ctmt="CTMT_${COUNT}"
            ogr2ogr \
              -t_srs EPSG:4326 \
              -f GeoJSON \
              -lco RFC7946=YES \
              -where "\"${CTMT_COL}\"='${ctmt}'" \
              "out/linhas-${safe_ctmt}.geojson" \
              out/ssdmt.gpkg "$TABLE" 2>/dev/null
            COUNT=$((COUNT + 1))
            if [ $((COUNT % 100)) -eq 0 ]; then
              echo "Progresso: $COUNT/$TOTAL_CTMT CTMTs"
              df -h .
            fi
          done < out/ctmts.txt

          rm -f out/ssdmt.gpkg out/ctmts.txt
          TOTAL_FILES=$(find out -name "linhas-*.geojson" | wc -l)
          echo "Arquivos gerados: $TOTAL_FILES"
          df -h .

      - name: Listar arquivos ja enviados (todas as releases)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Verificando arquivos ja enviados (release principal + overflows)..."
          mkdir -p out
          > out/uploaded.txt
          BASE_TAG="${{ inputs.tag }}"

          for SUFFIX in "" "-b" "-c" "-d" "-e"; do
            SCAN_TAG="${BASE_TAG}${SUFFIX}"
            SCAN_ID=$(timeout 30 gh api \
              "repos/KogaIgor0/markfield-web/releases/tags/${SCAN_TAG}" \
              -q '.id' 2>/dev/null || echo "")
            if [ -z "$SCAN_ID" ]; then continue; fi
            echo "  Escaneando: $SCAN_TAG (ID: $SCAN_ID)"
            PAGE=1
            while true; do
              BATCH=$(timeout 30 gh api \
                "repos/KogaIgor0/markfield-web/releases/${SCAN_ID}/assets?per_page=100&page=${PAGE}" \
                -q '.[].name' 2>/dev/null || true)
              [ -z "$BATCH" ] && break
              echo "$BATCH" >> out/uploaded.txt
              CNT=$(echo "$BATCH" | wc -l)
              [ "$CNT" -lt 100 ] && break
              PAGE=$((PAGE + 1))
            done
          done

          ALREADY=$(wc -l < out/uploaded.txt)
          echo "Total arquivos ja enviados: $ALREADY"

      - name: Upload linhas por CTMT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +o pipefail

          # Diagnostico via trap (escreve na release body ao sair)
          DIAG_RELEASE_ID="407125301"
          DIAG_MSG="v14-start"
          on_exit() {
            local EC=$?
            gh api --method PATCH \
              "repos/KogaIgor0/markfield-web/releases/${DIAG_RELEASE_ID}" \
              -f "body=DIAG-v14 exit=${EC}: ${DIAG_MSG}" 2>/dev/null || true
          }
          trap on_exit EXIT

          TOTAL=$(find out -name "linhas-*.geojson" | wc -l)
          DIAG_MSG="TOTAL=${TOTAL}"
          echo "Total arquivos geojson: $TOTAL"

          if [ "$TOTAL" -eq 0 ]; then
            echo "Nenhum arquivo linhas-*.geojson para upload."
            exit 1
          fi

          ALREADY=$(wc -l < out/uploaded.txt 2>/dev/null || echo 0)
          BASE_TAG="${{ inputs.tag }}"
          DIAG_MSG="TOTAL=${TOTAL} ALREADY=${ALREADY}"
          echo "Total: $TOTAL | Ja enviados: $ALREADY | Novos estimados: $((TOTAL - ALREADY))"

          # Usar gh api -q para extrair apenas os campos necessarios
          # (evita problema de JSON gigante com 1000 assets sendo parseado)
          RELEASE_ID=$(timeout 30 gh api \
            "repos/KogaIgor0/markfield-web/releases/tags/${BASE_TAG}" \
            -q '.id' 2>/dev/null || echo "")
          UPLOAD_URL_RAW=$(timeout 30 gh api \
            "repos/KogaIgor0/markfield-web/releases/tags/${BASE_TAG}" \
            -q '.upload_url' 2>/dev/null || echo "")
          UPLOAD_URL="${UPLOAD_URL_RAW%%\{*}"
          DIAG_MSG="TOTAL=${TOTAL} ALREADY=${ALREADY} RELEASE_ID=${RELEASE_ID}"

          if [ -z "$RELEASE_ID" ] || [ -z "$UPLOAD_URL" ]; then
            echo "ERRO: nao foi possivel obter release ${BASE_TAG}"
            echo "RELEASE_ID='${RELEASE_ID}' UPLOAD_URL='${UPLOAD_URL}'"
            exit 1
          fi
          echo "Release: $RELEASE_ID | Upload URL: ${UPLOAD_URL:0:60}..."

          CURRENT_UPLOAD_URL="$UPLOAD_URL"
          OVERFLOW_SUFFIX=""
          DIAG_MSG="TOTAL=${TOTAL} ALREADY=${ALREADY} RELEASE_ID=${RELEASE_ID} loop_inicio"

          upload_file() {
            local FPATH="$1"
            local FNAME="$2"
            local ENC_FNAME
            ENC_FNAME=$(python3 -c \
              "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" \
              "$FNAME" 2>/dev/null || echo "$FNAME")
            curl -s -o /tmp/upresp.json -w "%{http_code}" \
              --connect-timeout 15 \
              --max-time 90 \
              --retry 0 \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Content-Type: application/geo+json" \
              --data-binary "@$FPATH" \
              "${CURRENT_UPLOAD_URL}?name=${ENC_FNAME}" 2>/dev/null || echo "000"
          }

          COUNT=0
          SKIPPED=0
          FAILURES=0
          for f in out/linhas-*.geojson; do
            [ -f "$f" ] || continue
            FNAME=$(basename "$f")
            if grep -qxF "$FNAME" out/uploaded.txt 2>/dev/null; then
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            HTTP=$(upload_file "$f" "$FNAME")

            if [ "$HTTP" = "201" ]; then
              COUNT=$((COUNT + 1))
            elif [ "$HTTP" = "422" ]; then
              RESP_BODY=$(cat /tmp/upresp.json 2>/dev/null || echo "{}")
              IS_DUP=$(echo "$RESP_BODY" | python3 -c \
                "import sys,json; d=json.load(sys.stdin); e=d.get('errors',[]); print('yes' if any(x.get('code')=='already_exists' for x in e) else 'no')" \
                2>/dev/null || echo "no")
              if [ "$IS_DUP" = "yes" ]; then
                echo "INFO: $FNAME ja existe (already_exists), pulando"
                SKIPPED=$((SKIPPED + 1))
              else
                echo "INFO: Release ${BASE_TAG}${OVERFLOW_SUFFIX} cheia (422), criando overflow..."
                case "$OVERFLOW_SUFFIX" in
                  "")   OVERFLOW_SUFFIX="-b" ;;
                  "-b") OVERFLOW_SUFFIX="-c" ;;
                  "-c") OVERFLOW_SUFFIX="-d" ;;
                  *)    echo "ERRO: muitas releases overflow"; exit 1 ;;
                esac
                OVF_TAG="${BASE_TAG}${OVERFLOW_SUFFIX}"
                echo "Overflow tag: $OVF_TAG"
                DIAG_MSG="TOTAL=${TOTAL} COUNT=${COUNT} SKIP=${SKIPPED} criando_overflow=${OVF_TAG}"

                OVF_ID=$(timeout 30 gh api \
                  "repos/KogaIgor0/markfield-web/releases/tags/${OVF_TAG}" \
                  -q '.id' 2>/dev/null || echo "")
                OVF_UURL_RAW=$(timeout 30 gh api \
                  "repos/KogaIgor0/markfield-web/releases/tags/${OVF_TAG}" \
                  -q '.upload_url' 2>/dev/null || echo "")
                OVF_UURL="${OVF_UURL_RAW%%\{*}"

                if [ -z "$OVF_ID" ]; then
                  echo "Criando nova release: $OVF_TAG"
                  OVF_ID=$(timeout 60 gh api --method POST \
                    "repos/KogaIgor0/markfield-web/releases" \
                    -f "tag_name=${OVF_TAG}" \
                    -f "name=${OVF_TAG}" \
                    -f "body=Overflow de ${BASE_TAG} (linhas CTMT, parte ${OVERFLOW_SUFFIX})" \
                    -q '.id' 2>/dev/null || echo "")
                  OVF_UURL_RAW=$(timeout 30 gh api \
                    "repos/KogaIgor0/markfield-web/releases/tags/${OVF_TAG}" \
                    -q '.upload_url' 2>/dev/null || echo "")
                  OVF_UURL="${OVF_UURL_RAW%%\{*}"
                fi

                if [ -z "$OVF_ID" ] || [ -z "$OVF_UURL" ]; then
                  echo "ERRO: nao foi possivel criar release $OVF_TAG"
                  FAILURES=$((FAILURES + 1))
                else
                  echo "Usando release overflow: $OVF_TAG (ID=$OVF_ID)"
                  CURRENT_UPLOAD_URL="$OVF_UURL"
                  HTTP=$(upload_file "$f" "$FNAME")
                  if [ "$HTTP" = "201" ]; then
                    COUNT=$((COUNT + 1))
                  else
                    echo "ERRO: $FNAME nao enviado apos overflow (HTTP=$HTTP)"
                    FAILURES=$((FAILURES + 1))
                  fi
                fi
              fi
            else
              echo "AVISO: $FNAME HTTP=$HTTP, aguardando 20s e retentando..."
              sleep 20
              HTTP=$(upload_file "$f" "$FNAME")
              if [ "$HTTP" = "201" ]; then
                COUNT=$((COUNT + 1))
              else
                echo "ERRO: $FNAME nao enviado (HTTP=$HTTP)"
                FAILURES=$((FAILURES + 1))
              fi
            fi

            if [ $((COUNT % 100)) -eq 0 ] && [ $COUNT -gt 0 ]; then
              DIAG_MSG="TOTAL=${TOTAL} COUNT=${COUNT} SKIP=${SKIPPED} FAIL=${FAILURES} OVF=${OVERFLOW_SUFFIX}"
              echo "Progresso: $COUNT novos, $SKIPPED pulados, $FAILURES falhas | overflow: ${OVERFLOW_SUFFIX:-nenhum}"
            fi
            if [ $(( (COUNT + FAILURES) % 50 )) -eq 0 ] && [ $((COUNT + FAILURES)) -gt 0 ]; then
              echo "Pausa 60s rate limit..."
              sleep 60
            fi
          done

          DIAG_MSG="FINALIZADO COUNT=${COUNT} SKIP=${SKIPPED} FAIL=${FAILURES} OVF=${OVERFLOW_SUFFIX:-nenhum}"
          echo "Upload finalizado: $COUNT novos, $SKIPPED pulados, $FAILURES falhas."
          if [ "$FAILURES" -gt 0 ]; then
            exit 1
          fi
