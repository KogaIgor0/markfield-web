name: Split Linhas por CTMT

on:
  workflow_dispatch:
    inputs:
      dataset_id:
        description: 'ArcGIS Online item ID (arcgis.com/home/item.html?id=...)'
        required: true
      prefixo:
        description: 'Prefixo dos arquivos (ex: cemig_2024)'
        required: true
      tag:
        description: 'Tag do Release principal (ex: bdgd-cemig-2024)'
        required: true

jobs:
  split:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gdal-bin sqlite3 unzip python3
          echo "GDAL $(ogr2ogr --version)"
          echo "CPUs: $(nproc)"
          gh --version

      - name: Baixar BDGD do ArcGIS Online
        run: |
          echo "Baixando item ${{ inputs.dataset_id }}..."
          curl -L \
            --retry 3 \
            --retry-delay 30 \
            --connect-timeout 60 \
            --max-time 3600 \
            -H "Referer: https://www.arcgis.com/" \
            --fail \
            -o bdgd.gdb.zip \
            "https://www.arcgis.com/sharing/rest/content/items/${{ inputs.dataset_id }}/data"
          ls -lh bdgd.gdb.zip

      - name: Extrair GDB e converter SSDMT para GeoPackage
        run: |
          unzip -q bdgd.gdb.zip
          GDB=$(find . -maxdepth 2 -name "*.gdb" -type d | head -1)
          echo "GDB: $GDB"
          df -h .

          mkdir -p out
          ogr2ogr -t_srs EPSG:4326 -f GPKG out/ssdmt.gpkg "$GDB" SSDMT 2>/dev/null
          ls -lh out/ssdmt.gpkg

          rm -rf bdgd.gdb.zip "$GDB"
          df -h .

      - name: Dividir por CTMT (paralelo)
        run: |
          TABLE=$(sqlite3 out/ssdmt.gpkg \
            "SELECT name FROM sqlite_master WHERE type='table' AND lower(name) LIKE '%ssdmt%' LIMIT 1;" \
            2>/dev/null)
          if [ -z "$TABLE" ]; then
            sqlite3 out/ssdmt.gpkg ".tables" 2>/dev/null || true
            TABLE=$(sqlite3 out/ssdmt.gpkg \
              "SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'gpkg_%' AND name NOT LIKE 'rtree_%' AND name NOT LIKE 'sqlite_%' LIMIT 1;" \
              2>/dev/null)
            echo "Usando tabela: $TABLE"
          fi
          [ -z "$TABLE" ] && { echo "ERRO: nenhuma tabela no GPKG"; exit 1; }
          echo "Tabela: $TABLE"

          CTMT_COL=$(sqlite3 out/ssdmt.gpkg \
            "SELECT name FROM pragma_table_info('$TABLE') WHERE lower(name) IN ('ctmt','cod_ctmt') ORDER BY CASE lower(name) WHEN 'ctmt' THEN 0 ELSE 1 END LIMIT 1;" \
            2>/dev/null)
          if [ -z "$CTMT_COL" ]; then
            echo "ERRO: coluna CTMT nao encontrada"
            sqlite3 out/ssdmt.gpkg "PRAGMA table_info('$TABLE');" 2>/dev/null | awk -F'|' '{print $2}' || true
            exit 1
          fi
          echo "Coluna CTMT: $CTMT_COL"

          sqlite3 out/ssdmt.gpkg \
            "PRAGMA journal_mode=WAL; CREATE INDEX IF NOT EXISTS idx_ctmt ON \"$TABLE\"(\"$CTMT_COL\");" \
            2>/dev/null || true

          sqlite3 out/ssdmt.gpkg \
            "SELECT DISTINCT \"$CTMT_COL\" FROM \"$TABLE\" WHERE \"$CTMT_COL\" IS NOT NULL AND \"$CTMT_COL\" != '' ORDER BY \"$CTMT_COL\";" \
            > out/ctmts.txt 2>/dev/null
          TOTAL_CTMT=$(wc -l < out/ctmts.txt)
          echo "CTMTs: $TOTAL_CTMT"
          [ "$TOTAL_CTMT" -eq 0 ] && { echo "AVISO: nenhum CTMT"; exit 1; }

          cat > /tmp/do_split.sh << 'SPLITEOF'
          #!/bin/bash
          ctmt="$1"; CTMT_COL="$2"; TABLE="$3"; GPKG="$4"; OUT_DIR="$5"
          safe_ctmt=$(printf '%s' "$ctmt" | tr -dc 'a-zA-Z0-9_-')
          [ -z "$safe_ctmt" ] && safe_ctmt="CTMT_$(printf '%s' "$ctmt" | sha256sum | cut -c1-8)"
          ogr2ogr -t_srs EPSG:4326 -f GeoJSON -lco RFC7946=YES \
            -where "\"${CTMT_COL}\"='${ctmt}'" \
            "${OUT_DIR}/linhas-${safe_ctmt}.geojson" "$GPKG" "$TABLE" 2>/dev/null
          SPLITEOF
          chmod +x /tmp/do_split.sh

          NPROC=$(nproc)
          echo "Split paralelo com $NPROC workers..."
          cat out/ctmts.txt | xargs -P "$NPROC" -I{} \
            /tmp/do_split.sh {} "$CTMT_COL" "$TABLE" "out/ssdmt.gpkg" "out"

          rm -f out/ssdmt.gpkg out/ctmts.txt
          TOTAL_FILES=$(find out -name "linhas-*.geojson" | wc -l)
          echo "Arquivos gerados: $TOTAL_FILES"
          df -h .

      - name: Listar arquivos ja enviados (todas as releases)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p out
          > out/uploaded.txt
          BASE_TAG="${{ inputs.tag }}"

          for SUFFIX in "" "-b" "-c" "-d" "-e"; do
            SCAN_TAG="${BASE_TAG}${SUFFIX}"
            SCAN_ID=$(timeout 30 gh api \
              "repos/KogaIgor0/markfield-web/releases/tags/${SCAN_TAG}" \
              -q '.id' 2>/dev/null || echo "")
            [ -z "$SCAN_ID" ] && continue
            echo "  Escaneando: $SCAN_TAG (ID: $SCAN_ID)"
            PAGE=1
            while true; do
              BATCH=$(timeout 30 gh api \
                "repos/KogaIgor0/markfield-web/releases/${SCAN_ID}/assets?per_page=100&page=${PAGE}" \
                -q '.[].name' 2>/dev/null || true)
              [ -z "$BATCH" ] && break
              echo "$BATCH" >> out/uploaded.txt
              CNT=$(echo "$BATCH" | wc -l)
              [ "$CNT" -lt 100 ] && break
              PAGE=$((PAGE + 1))
            done
          done

          ALREADY=$(wc -l < out/uploaded.txt)
          echo "Total ja enviados: $ALREADY"

      - name: Upload linhas por CTMT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +o pipefail

          DIAG_RELEASE_ID="407125301"
          DIAG_MSG="v19-start"
          on_exit() {
            local EC=$?
            gh api --method PATCH \
              "repos/KogaIgor0/markfield-web/releases/${DIAG_RELEASE_ID}" \
              -f "body=DIAG-v19 exit=${EC}: ${DIAG_MSG}" 2>/dev/null || true
          }
          trap on_exit EXIT

          BASE_TAG="${{ inputs.tag }}"
          REPO="KogaIgor0/markfield-web"
          MAX_PER_RELEASE=990

          TOTAL=$(find out -name "linhas-*.geojson" | wc -l)
          DIAG_MSG="TOTAL=${TOTAL}"
          echo "Total geojsons: $TOTAL"
          [ "$TOTAL" -eq 0 ] && { echo "Nenhum arquivo."; exit 1; }

          ALREADY=$(wc -l < out/uploaded.txt 2>/dev/null || echo 0)
          echo "Ja enviados: $ALREADY"
          DIAG_MSG="TOTAL=${TOTAL} ALREADY=${ALREADY}"

          # Construir lista de arquivos para upload
          while IFS= read -r f; do
            FNAME=$(basename "$f")
            grep -qxF "$FNAME" out/uploaded.txt 2>/dev/null || echo "$f"
          done < <(find out -name "linhas-*.geojson" | sort) > out/to_upload.txt

          TO_UPLOAD=$(wc -l < out/to_upload.txt)
          echo "Para upload: $TO_UPLOAD"
          DIAG_MSG="TOTAL=${TOTAL} ALREADY=${ALREADY} TO_UPLOAD=${TO_UPLOAD}"
          [ "$TO_UPLOAD" -eq 0 ] && { echo "Nenhum arquivo novo."; DIAG_MSG="TODOS_ENVIADOS"; exit 0; }

          # Criar release se nao existir; verifica que o ID foi criado
          create_release_if_missing() {
            local TAG="$1" SUFFIX="$2"
            local ID RC
            ID=$(gh api "repos/$REPO/releases/tags/${TAG}" -q '.id' 2>/dev/null)
            RC=$?
            if [ $RC -eq 0 ] && echo "$ID" | grep -qE '^[0-9]+$'; then
              echo "Release ${TAG} existe (ID=${ID})"
              return 0
            fi
            echo "Criando release ${TAG}..."
            ID=$(gh api --method POST "repos/$REPO/releases" \
              -f "tag_name=${TAG}" \
              -f "name=${TAG}" \
              -f "body=Overflow de ${BASE_TAG} (parte ${SUFFIX})" \
              -q '.id' 2>&1)
            RC=$?
            if [ $RC -ne 0 ] || ! echo "$ID" | grep -qE '^[0-9]+$'; then
              echo "ERRO ao criar ${TAG} (rc=${RC}): ${ID}"
              return 1
            fi
            echo "Release ${TAG} criada (ID=${ID})"
            return 0
          }

          # Upload de um lote — verifica exit code sem pipe
          upload_batch() {
            local TAG="$1"; shift
            local FILES=("$@")
            local OUT RC
            OUT=$(gh release upload --repo "$REPO" "$TAG" "${FILES[@]}" --clobber 2>&1)
            RC=$?
            if [ $RC -ne 0 ]; then
              echo "  FALHA lote rc=${RC} | $(echo "$OUT" | head -3)"
              return 1
            fi
            echo "  OK ${#FILES[@]} arquivos → ${TAG}"
            return 0
          }

          # Criar overflow -b (sempre necessario: release principal esta cheia)
          DIAG_MSG="TOTAL=${TOTAL} TO_UPLOAD=${TO_UPLOAD} criando_overflows"
          OVF_B="${BASE_TAG}-b"
          create_release_if_missing "$OVF_B" "-b" || { DIAG_MSG="ERRO_CRIAR_OVF_B"; exit 1; }

          # Criar -c se TO_UPLOAD > MAX_PER_RELEASE
          OVF_C="${BASE_TAG}-c"
          if [ "$TO_UPLOAD" -gt "$MAX_PER_RELEASE" ]; then
            create_release_if_missing "$OVF_C" "-c" || { DIAG_MSG="ERRO_CRIAR_OVF_C"; exit 1; }
          fi

          echo "=== Iniciando uploads: $TO_UPLOAD arquivos ==="
          DIAG_MSG="TOTAL=${TOTAL} TO_UPLOAD=${TO_UPLOAD} loop_start"

          COUNT=0
          FAILURES=0
          BATCH=()
          CURRENT_TAG="$OVF_B"
          CURRENT_COUNT=0   # quantos enviados ao CURRENT_TAG nesta execucao

          flush_batch() {
            [ "${#BATCH[@]}" -eq 0 ] && return 0
            local BATCH_COPY=("${BATCH[@]}")
            BATCH=()
            if upload_batch "$CURRENT_TAG" "${BATCH_COPY[@]}"; then
              COUNT=$((COUNT + ${#BATCH_COPY[@]}))
              CURRENT_COUNT=$((CURRENT_COUNT + ${#BATCH_COPY[@]}))
            else
              # Tentar arquivo por arquivo para recuperar o maximo
              local SF RC OUT
              for SF in "${BATCH_COPY[@]}"; do
                OUT=$(gh release upload --repo "$REPO" "$CURRENT_TAG" "$SF" --clobber 2>&1)
                RC=$?
                if [ $RC -eq 0 ]; then
                  COUNT=$((COUNT + 1))
                  CURRENT_COUNT=$((CURRENT_COUNT + 1))
                else
                  echo "  ERRO $(basename $SF) rc=${RC}: $(echo "$OUT" | head -1)"
                  FAILURES=$((FAILURES + 1))
                fi
              done
            fi
          }

          while IFS= read -r FPATH; do
            # Trocar para overflow -c quando -b estiver cheia
            if [ "$CURRENT_COUNT" -ge "$MAX_PER_RELEASE" ] && [ "$CURRENT_TAG" = "$OVF_B" ]; then
              flush_batch
              echo "=== Trocando para ${OVF_C} ==="
              DIAG_MSG="TOTAL=${TOTAL} COUNT=${COUNT} FAIL=${FAILURES} trocando_para_c"
              CURRENT_TAG="$OVF_C"
              CURRENT_COUNT=0
            fi

            BATCH+=("$FPATH")

            if [ "${#BATCH[@]}" -ge 50 ]; then
              flush_batch
              if [ $((COUNT % 500)) -lt 50 ] && [ $COUNT -gt 0 ]; then
                DIAG_MSG="TOTAL=${TOTAL} COUNT=${COUNT} FAIL=${FAILURES} ovf=${CURRENT_TAG}"
                echo "Progresso: $COUNT enviados, $FAILURES falhas | ${CURRENT_TAG}"
              fi
            fi
          done < out/to_upload.txt

          flush_batch

          DIAG_MSG="FINALIZADO COUNT=${COUNT} FAIL=${FAILURES} OVF=${CURRENT_TAG}"
          echo "Finalizado: $COUNT enviados, $FAILURES falhas."
          [ "$FAILURES" -gt 0 ] && exit 1
