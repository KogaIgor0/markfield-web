name: Split Linhas por CTMT

on:
  workflow_dispatch:
    inputs:
      dataset_id:
        description: 'ArcGIS Online item ID (arcgis.com/home/item.html?id=...)'
        required: true
      prefixo:
        description: 'Prefixo dos arquivos (ex: cemig_2024)'
        required: true
      tag:
        description: 'Tag do Release principal (ex: bdgd-cemig-2024)'
        required: true

jobs:
  split:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gdal-bin sqlite3 unzip python3
          echo "GDAL $(ogr2ogr --version)"

      - name: Baixar BDGD do ArcGIS Online
        run: |
          echo "Baixando item ${{ inputs.dataset_id }}..."
          curl -L \
            --retry 3 \
            --retry-delay 30 \
            --connect-timeout 60 \
            --max-time 3600 \
            -H "Referer: https://www.arcgis.com/" \
            --fail \
            -o bdgd.gdb.zip \
            "https://www.arcgis.com/sharing/rest/content/items/${{ inputs.dataset_id }}/data"
          ls -lh bdgd.gdb.zip

      - name: Extrair GDB e converter SSDMT para GeoPackage
        run: |
          unzip -q bdgd.gdb.zip
          GDB=$(find . -maxdepth 2 -name "*.gdb" -type d | head -1)
          echo "GDB: $GDB"
          df -h .

          mkdir -p out
          echo "Convertendo SSDMT para GeoPackage (eficiente em memoria)..."
          ogr2ogr -t_srs EPSG:4326 -f GPKG out/ssdmt.gpkg "$GDB" SSDMT 2>/dev/null
          ls -lh out/ssdmt.gpkg

          rm -rf bdgd.gdb.zip "$GDB"
          df -h .

      - name: Dividir por CTMT
        run: |
          # Descobrir nome real da tabela no GPKG (pode ser SSDMT ou ssdmt dependendo do GDAL)
          TABLE=$(sqlite3 out/ssdmt.gpkg \
            "SELECT name FROM sqlite_master WHERE type='table' AND lower(name) LIKE '%ssdmt%' LIMIT 1;" \
            2>/dev/null)
          if [ -z "$TABLE" ]; then
            echo "Tabela SSDMT nao encontrada. Tabelas no GPKG:"
            sqlite3 out/ssdmt.gpkg ".tables" 2>/dev/null || true
            TABLE=$(sqlite3 out/ssdmt.gpkg \
              "SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'gpkg_%' AND name NOT LIKE 'rtree_%' AND name NOT LIKE 'sqlite_%' LIMIT 1;" \
              2>/dev/null)
            echo "Usando tabela: $TABLE"
          fi
          if [ -z "$TABLE" ]; then
            echo "ERRO: Nenhuma tabela encontrada no GPKG."
            exit 1
          fi
          echo "Tabela: $TABLE"

          # Encontrar coluna CTMT (case-insensitive)
          CTMT_COL=$(sqlite3 out/ssdmt.gpkg \
            "SELECT name FROM pragma_table_info('$TABLE') WHERE lower(name) IN ('ctmt','cod_ctmt') ORDER BY CASE lower(name) WHEN 'ctmt' THEN 0 ELSE 1 END LIMIT 1;" \
            2>/dev/null)
          if [ -z "$CTMT_COL" ]; then
            echo "ERRO: Coluna CTMT/COD_CTMT nao encontrada. Colunas disponiveis:"
            sqlite3 out/ssdmt.gpkg "PRAGMA table_info('$TABLE');" 2>/dev/null | awk -F'|' '{print $2}' || true
            exit 1
          fi
          echo "Coluna CTMT: $CTMT_COL"

          # Criar indice para queries rapidas
          sqlite3 out/ssdmt.gpkg \
            "CREATE INDEX IF NOT EXISTS idx_ctmt ON \"$TABLE\"(\"$CTMT_COL\");" 2>/dev/null || true

          # Obter lista de CTMTs unicos
          sqlite3 out/ssdmt.gpkg \
            "SELECT DISTINCT \"$CTMT_COL\" FROM \"$TABLE\" WHERE \"$CTMT_COL\" IS NOT NULL AND \"$CTMT_COL\" != '' ORDER BY \"$CTMT_COL\";" \
            > out/ctmts.txt 2>/dev/null
          TOTAL_CTMT=$(wc -l < out/ctmts.txt)
          echo "CTMTs encontrados: $TOTAL_CTMT"

          if [ "$TOTAL_CTMT" -eq 0 ]; then
            echo "AVISO: Nenhum CTMT encontrado. Amostra da tabela:"
            sqlite3 out/ssdmt.gpkg "SELECT * FROM \"$TABLE\" LIMIT 2;" 2>/dev/null || true
            exit 1
          fi

          # Exportar um GeoJSON por CTMT usando ogr2ogr -where (eficiente com indice)
          COUNT=0
          while IFS= read -r ctmt; do
            [ -z "$ctmt" ] && continue
            safe_ctmt=$(printf '%s' "$ctmt" | tr -dc 'a-zA-Z0-9_-')
            [ -z "$safe_ctmt" ] && safe_ctmt="CTMT_${COUNT}"
            ogr2ogr \
              -t_srs EPSG:4326 \
              -f GeoJSON \
              -lco RFC7946=YES \
              -where "\"${CTMT_COL}\"='${ctmt}'" \
              "out/linhas-${safe_ctmt}.geojson" \
              out/ssdmt.gpkg "$TABLE" 2>/dev/null
            COUNT=$((COUNT + 1))
            if [ $((COUNT % 100)) -eq 0 ]; then
              echo "Progresso: $COUNT/$TOTAL_CTMT CTMTs"
              df -h .
            fi
          done < out/ctmts.txt

          rm -f out/ssdmt.gpkg out/ctmts.txt
          TOTAL_FILES=$(ls out/linhas-*.geojson 2>/dev/null | wc -l)
          echo "Arquivos gerados: $TOTAL_FILES"
          df -h .

      - name: Listar arquivos ja enviados no release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Verificando arquivos ja enviados para evitar re-upload..."
          mkdir -p out
          > out/uploaded.txt
          RELEASE_ID=$(gh api "repos/KogaIgor0/markfield-web/releases/tags/${{ inputs.tag }}" \
            -q '.id' 2>/dev/null || echo "")
          if [ -n "$RELEASE_ID" ]; then
            PAGE=1
            while true; do
              BATCH=$(gh api "repos/KogaIgor0/markfield-web/releases/$RELEASE_ID/assets?per_page=100&page=$PAGE" \
                -q '.[].name' 2>/dev/null || true)
              [ -z "$BATCH" ] && break
              echo "$BATCH" >> out/uploaded.txt
              COUNT=$(echo "$BATCH" | wc -l)
              [ "$COUNT" -lt 100 ] && break
              PAGE=$((PAGE + 1))
            done
          fi
          ALREADY=$(wc -l < out/uploaded.txt)
          echo "Arquivos ja enviados: $ALREADY"

      - name: Upload linhas por CTMT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TOTAL=$(ls out/linhas-*.geojson 2>/dev/null | wc -l)
          if [ "$TOTAL" -eq 0 ]; then
            echo "Nenhum arquivo linhas-*.geojson para upload."
            exit 1
          fi
          ALREADY=$(wc -l < out/uploaded.txt 2>/dev/null || echo 0)
          echo "Fazendo upload de $TOTAL arquivos para release ${{ inputs.tag }} (ja enviados: $ALREADY)..."

          # Obter release_id e upload_url via gh api (com timeout defensivo)
          RELEASE_INFO=$(timeout 30 gh api \
            "repos/KogaIgor0/markfield-web/releases/tags/${{ inputs.tag }}" \
            2>/dev/null || echo "{}")
          RELEASE_ID=$(echo "$RELEASE_INFO" | python3 -c \
            "import sys,json; d=json.load(sys.stdin); print(d.get('id',''))" 2>/dev/null)
          UPLOAD_URL=$(echo "$RELEASE_INFO" | python3 -c \
            "import sys,json; d=json.load(sys.stdin); u=d.get('upload_url',''); print(u.split('{')[0])" 2>/dev/null)
          if [ -z "$RELEASE_ID" ] || [ -z "$UPLOAD_URL" ]; then
            echo "ERRO: nao foi possivel obter RELEASE_ID ou UPLOAD_URL."
            echo "RELEASE_INFO: $RELEASE_INFO"
            exit 1
          fi
          echo "Release ID: $RELEASE_ID | Upload URL: $UPLOAD_URL"

          upload_file() {
            local FPATH="$1"
            local FNAME="$2"
            local ENC_FNAME
            ENC_FNAME=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$FNAME")
            curl -s -o /tmp/upresp.json -w "%{http_code}" \
              --connect-timeout 15 \
              --max-time 90 \
              --retry 0 \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Content-Type: application/geo+json" \
              --data-binary "@$FPATH" \
              "${UPLOAD_URL}?name=${ENC_FNAME}" 2>/dev/null || echo "000"
          }

          # === TESTE DIAGNOSTICO: tentar upload do primeiro arquivo novo ===
          FIRST_NEW=""
          for f in out/linhas-*.geojson; do
            [ -f "$f" ] || continue
            FNAME=$(basename "$f")
            if ! grep -qxF "$FNAME" out/uploaded.txt 2>/dev/null; then
              FIRST_NEW="$f"
              FIRST_NEW_FNAME="$FNAME"
              break
            fi
          done

          DIAG_MSG="DIAG v10 $(date -u +%Y-%m-%dT%H:%M:%SZ): TOTAL=$TOTAL ALREADY=$ALREADY"
          if [ -z "$FIRST_NEW" ]; then
            echo "Nenhum arquivo novo para upload (todos ja enviados)."
            DIAG_MSG="$DIAG_MSG FIRST_NEW=none"
            gh api --method PATCH \
              "repos/KogaIgor0/markfield-web/releases/$RELEASE_ID" \
              -f "body=$DIAG_MSG" 2>/dev/null || true
            exit 0
          fi

          echo "=== TESTE DIAGNOSTICO: $FIRST_NEW_FNAME ==="
          FSIZE=$(wc -c < "$FIRST_NEW")
          echo "Tamanho: $FSIZE bytes"
          TEST_HTTP=$(upload_file "$FIRST_NEW" "$FIRST_NEW_FNAME")
          TEST_RESP=$(cat /tmp/upresp.json 2>/dev/null | head -c 200 || echo "")
          echo "TEST HTTP=$TEST_HTTP RESP=$TEST_RESP"
          DIAG_MSG="$DIAG_MSG FIRST_NEW=$FIRST_NEW_FNAME SIZE=$FSIZE TEST_HTTP=$TEST_HTTP RESP=${TEST_RESP:0:100}"
          gh api --method PATCH \
            "repos/KogaIgor0/markfield-web/releases/$RELEASE_ID" \
            -f "body=$DIAG_MSG" 2>/dev/null || true

          if [ "$TEST_HTTP" != "201" ]; then
            echo "ERRO: Test upload falhou HTTP=$TEST_HTTP. Abortando."
            exit 1
          fi
          echo "Test upload OK. Iniciando loop principal..."

          # === LOOP PRINCIPAL ===
          COUNT=1
          SKIPPED=0
          FAILURES=0
          for f in out/linhas-*.geojson; do
            [ -f "$f" ] || continue
            FNAME=$(basename "$f")
            # Pular arquivos já enviados E o arquivo de teste (ja foi enviado acima)
            if grep -qxF "$FNAME" out/uploaded.txt 2>/dev/null || [ "$FNAME" = "$FIRST_NEW_FNAME" ]; then
              SKIPPED=$((SKIPPED + 1))
              continue
            fi
            HTTP=$(upload_file "$f" "$FNAME")
            if [ "$HTTP" = "201" ]; then
              COUNT=$((COUNT + 1))
            else
              echo "AVISO: $FNAME HTTP=$HTTP, aguardando 20s e retentando..."
              sleep 20
              HTTP=$(upload_file "$f" "$FNAME")
              if [ "$HTTP" = "201" ]; then
                COUNT=$((COUNT + 1))
              else
                echo "ERRO: $FNAME nao enviado (HTTP=$HTTP)"
                FAILURES=$((FAILURES + 1))
              fi
            fi
            if [ $(( (COUNT + FAILURES) % 50 )) -eq 0 ] && [ $((COUNT + FAILURES)) -gt 0 ]; then
              echo "[$((COUNT + FAILURES))] Pausa 60s para evitar rate limit..."
              sleep 60
            fi
            if [ $((COUNT % 100)) -eq 0 ] && [ $COUNT -gt 0 ]; then
              echo "Progresso: $COUNT novos, $SKIPPED pulados, $FAILURES falhas"
            fi
          done
          echo "Upload linhas: $COUNT novos, $SKIPPED pulados, $FAILURES falhas."
          [ "$FAILURES" -eq 0 ]
