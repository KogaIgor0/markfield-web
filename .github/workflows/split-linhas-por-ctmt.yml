name: Split Linhas por CTMT

on:
  workflow_dispatch:
    inputs:
      dataset_id:
        description: 'ArcGIS Online item ID (arcgis.com/home/item.html?id=...)'
        required: true
      prefixo:
        description: 'Prefixo dos arquivos (ex: cemig_2024)'
        required: true
      tag:
        description: 'Tag do Release principal (ex: bdgd-cemig-2024)'
        required: true

jobs:
  split:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gdal-bin sqlite3 unzip python3
          echo "GDAL $(ogr2ogr --version)"

      - name: Baixar BDGD do ArcGIS Online
        run: |
          echo "Baixando item ${{ inputs.dataset_id }}..."
          curl -L \
            --retry 3 \
            --retry-delay 30 \
            --connect-timeout 60 \
            --max-time 3600 \
            -H "Referer: https://www.arcgis.com/" \
            --fail \
            -o bdgd.gdb.zip \
            "https://www.arcgis.com/sharing/rest/content/items/${{ inputs.dataset_id }}/data"
          ls -lh bdgd.gdb.zip

      - name: Extrair GDB e converter SSDMT para GeoPackage
        run: |
          unzip -q bdgd.gdb.zip
          GDB=$(find . -maxdepth 2 -name "*.gdb" -type d | head -1)
          echo "GDB: $GDB"
          df -h .

          mkdir -p out
          echo "Convertendo SSDMT para GeoPackage (eficiente em memoria)..."
          ogr2ogr -t_srs EPSG:4326 -f GPKG out/ssdmt.gpkg "$GDB" SSDMT 2>/dev/null
          ls -lh out/ssdmt.gpkg

          rm -rf bdgd.gdb.zip "$GDB"
          df -h .

      - name: Dividir por CTMT
        run: |
          TABLE=$(sqlite3 out/ssdmt.gpkg \
            "SELECT name FROM sqlite_master WHERE type='table' AND lower(name) LIKE '%ssdmt%' LIMIT 1;" \
            2>/dev/null)
          if [ -z "$TABLE" ]; then
            echo "Tabela SSDMT nao encontrada. Tabelas no GPKG:"
            sqlite3 out/ssdmt.gpkg ".tables" 2>/dev/null || true
            TABLE=$(sqlite3 out/ssdmt.gpkg \
              "SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'gpkg_%' AND name NOT LIKE 'rtree_%' AND name NOT LIKE 'sqlite_%' LIMIT 1;" \
              2>/dev/null)
            echo "Usando tabela: $TABLE"
          fi
          if [ -z "$TABLE" ]; then
            echo "ERRO: Nenhuma tabela encontrada no GPKG."
            exit 1
          fi
          echo "Tabela: $TABLE"

          CTMT_COL=$(sqlite3 out/ssdmt.gpkg \
            "SELECT name FROM pragma_table_info('$TABLE') WHERE lower(name) IN ('ctmt','cod_ctmt') ORDER BY CASE lower(name) WHEN 'ctmt' THEN 0 ELSE 1 END LIMIT 1;" \
            2>/dev/null)
          if [ -z "$CTMT_COL" ]; then
            echo "ERRO: Coluna CTMT/COD_CTMT nao encontrada. Colunas disponiveis:"
            sqlite3 out/ssdmt.gpkg "PRAGMA table_info('$TABLE');" 2>/dev/null | awk -F'|' '{print $2}' || true
            exit 1
          fi
          echo "Coluna CTMT: $CTMT_COL"

          sqlite3 out/ssdmt.gpkg \
            "CREATE INDEX IF NOT EXISTS idx_ctmt ON \"$TABLE\"(\"$CTMT_COL\");" 2>/dev/null || true

          sqlite3 out/ssdmt.gpkg \
            "SELECT DISTINCT \"$CTMT_COL\" FROM \"$TABLE\" WHERE \"$CTMT_COL\" IS NOT NULL AND \"$CTMT_COL\" != '' ORDER BY \"$CTMT_COL\";" \
            > out/ctmts.txt 2>/dev/null
          TOTAL_CTMT=$(wc -l < out/ctmts.txt)
          echo "CTMTs encontrados: $TOTAL_CTMT"

          if [ "$TOTAL_CTMT" -eq 0 ]; then
            echo "AVISO: Nenhum CTMT encontrado. Amostra da tabela:"
            sqlite3 out/ssdmt.gpkg "SELECT * FROM \"$TABLE\" LIMIT 2;" 2>/dev/null || true
            exit 1
          fi

          COUNT=0
          while IFS= read -r ctmt; do
            [ -z "$ctmt" ] && continue
            safe_ctmt=$(printf '%s' "$ctmt" | tr -dc 'a-zA-Z0-9_-')
            [ -z "$safe_ctmt" ] && safe_ctmt="CTMT_${COUNT}"
            ogr2ogr \
              -t_srs EPSG:4326 \
              -f GeoJSON \
              -lco RFC7946=YES \
              -where "\"${CTMT_COL}\"='${ctmt}'" \
              "out/linhas-${safe_ctmt}.geojson" \
              out/ssdmt.gpkg "$TABLE" 2>/dev/null
            COUNT=$((COUNT + 1))
            if [ $((COUNT % 100)) -eq 0 ]; then
              echo "Progresso: $COUNT/$TOTAL_CTMT CTMTs"
              df -h .
            fi
          done < out/ctmts.txt

          rm -f out/ssdmt.gpkg out/ctmts.txt
          TOTAL_FILES=$(ls out/linhas-*.geojson 2>/dev/null | wc -l)
          echo "Arquivos gerados: $TOTAL_FILES"
          df -h .

      - name: Listar arquivos ja enviados (todas as releases)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Verificando arquivos ja enviados (release principal + overflows)..."
          mkdir -p out
          > out/uploaded.txt
          BASE_TAG="${{ inputs.tag }}"

          scan_release() {
            local SCAN_TAG="$1"
            local SCAN_ID
            SCAN_ID=$(timeout 30 gh api \
              "repos/KogaIgor0/markfield-web/releases/tags/${SCAN_TAG}" \
              -q '.id' 2>/dev/null || echo "")
            [ -z "$SCAN_ID" ] && return
            echo "  Escaneando: $SCAN_TAG (ID: $SCAN_ID)"
            local PAGE=1
            while true; do
              local BATCH
              BATCH=$(timeout 30 gh api \
                "repos/KogaIgor0/markfield-web/releases/${SCAN_ID}/assets?per_page=100&page=${PAGE}" \
                -q '.[].name' 2>/dev/null || true)
              [ -z "$BATCH" ] && break
              echo "$BATCH" >> out/uploaded.txt
              local CNT
              CNT=$(echo "$BATCH" | wc -l)
              [ "$CNT" -lt 100 ] && break
              PAGE=$((PAGE + 1))
            done
          }

          for SUFFIX in "" "-b" "-c" "-d" "-e"; do
            scan_release "${BASE_TAG}${SUFFIX}"
          done

          ALREADY=$(wc -l < out/uploaded.txt)
          echo "Total arquivos ja enviados: $ALREADY"

      - name: Upload linhas por CTMT (com releases overflow automaticas)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TOTAL=$(ls out/linhas-*.geojson 2>/dev/null | wc -l)
          if [ "$TOTAL" -eq 0 ]; then
            echo "Nenhum arquivo linhas-*.geojson para upload."
            exit 1
          fi
          ALREADY=$(wc -l < out/uploaded.txt 2>/dev/null || echo 0)
          BASE_TAG="${{ inputs.tag }}"
          echo "Total arquivos: $TOTAL | Ja enviados: $ALREADY | Novos: $((TOTAL - ALREADY))"

          # Variaveis de estado da release atual
          CURRENT_RELEASE_ID=""
          CURRENT_UPLOAD_URL=""
          CURRENT_TAG=""
          OVERFLOW_SUFFIX=""

          # Obter info da release principal
          load_release_info() {
            local TAG="$1"
            local INFO
            INFO=$(timeout 30 gh api \
              "repos/KogaIgor0/markfield-web/releases/tags/${TAG}" \
              2>/dev/null || echo "{}")
            CURRENT_RELEASE_ID=$(echo "$INFO" | python3 -c \
              "import sys,json; d=json.load(sys.stdin); print(d.get('id',''))" 2>/dev/null)
            CURRENT_UPLOAD_URL=$(echo "$INFO" | python3 -c \
              "import sys,json; d=json.load(sys.stdin); u=d.get('upload_url',''); print(u.split('{')[0])" 2>/dev/null)
            CURRENT_TAG="$TAG"
          }

          # Criar ou recuperar a proxima release overflow
          switch_overflow() {
            case "$OVERFLOW_SUFFIX" in
              "")   OVERFLOW_SUFFIX="-b" ;;
              "-b") OVERFLOW_SUFFIX="-c" ;;
              "-c") OVERFLOW_SUFFIX="-d" ;;
              "-d") OVERFLOW_SUFFIX="-e" ;;
              *)    echo "ERRO: limite de releases overflow atingido"; exit 1 ;;
            esac
            local NEXT_TAG="${BASE_TAG}${OVERFLOW_SUFFIX}"
            echo "=== Overflow: tentando release ${NEXT_TAG} ==="

            # Verificar se ja existe
            local INFO
            INFO=$(timeout 30 gh api \
              "repos/KogaIgor0/markfield-web/releases/tags/${NEXT_TAG}" \
              2>/dev/null || echo "{}")
            local EXISTING_ID
            EXISTING_ID=$(echo "$INFO" | python3 -c \
              "import sys,json; d=json.load(sys.stdin); print(d.get('id',''))" 2>/dev/null)

            if [ -n "$EXISTING_ID" ]; then
              echo "Release overflow existente: ${NEXT_TAG} (ID: $EXISTING_ID)"
              CURRENT_RELEASE_ID="$EXISTING_ID"
              CURRENT_UPLOAD_URL=$(echo "$INFO" | python3 -c \
                "import sys,json; d=json.load(sys.stdin); u=d.get('upload_url',''); print(u.split('{')[0])" 2>/dev/null)
            else
              echo "Criando release overflow: ${NEXT_TAG}"
              INFO=$(timeout 60 gh api --method POST \
                "repos/KogaIgor0/markfield-web/releases" \
                -f "tag_name=${NEXT_TAG}" \
                -f "name=${NEXT_TAG}" \
                -f "body=Overflow de ${BASE_TAG} (linhas split por CTMT, parte ${OVERFLOW_SUFFIX})" \
                2>/dev/null || echo "{}")
              CURRENT_RELEASE_ID=$(echo "$INFO" | python3 -c \
                "import sys,json; d=json.load(sys.stdin); print(d.get('id',''))" 2>/dev/null)
              CURRENT_UPLOAD_URL=$(echo "$INFO" | python3 -c \
                "import sys,json; d=json.load(sys.stdin); u=d.get('upload_url',''); print(u.split('{')[0])" 2>/dev/null)
              if [ -z "$CURRENT_RELEASE_ID" ] || [ -z "$CURRENT_UPLOAD_URL" ]; then
                echo "ERRO: Nao foi possivel criar release overflow ${NEXT_TAG}"
                echo "Resposta: $INFO"
                exit 1
              fi
              echo "Release criada: ID=$CURRENT_RELEASE_ID"
            fi
            CURRENT_TAG="$NEXT_TAG"
            echo "Upload agora em: $CURRENT_TAG"
          }

          upload_file() {
            local FPATH="$1"
            local FNAME="$2"
            local ENC_FNAME
            ENC_FNAME=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$FNAME")
            curl -s -o /tmp/upresp.json -w "%{http_code}" \
              --connect-timeout 15 \
              --max-time 90 \
              --retry 0 \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Content-Type: application/geo+json" \
              --data-binary "@$FPATH" \
              "${CURRENT_UPLOAD_URL}?name=${ENC_FNAME}" 2>/dev/null || echo "000"
          }

          is_422_already_exists() {
            python3 -c "import json; d=json.load(open('/tmp/upresp.json')); e=d.get('errors',[]); print('yes' if any(x.get('code')=='already_exists' for x in e) else 'no')" 2>/dev/null || echo "no"
          }

          # Iniciar com a release principal
          load_release_info "${BASE_TAG}"
          if [ -z "$CURRENT_RELEASE_ID" ] || [ -z "$CURRENT_UPLOAD_URL" ]; then
            echo "ERRO: nao foi possivel obter info da release ${BASE_TAG}"
            exit 1
          fi
          echo "Release inicial: $CURRENT_TAG (ID: $CURRENT_RELEASE_ID)"

          COUNT=0
          SKIPPED=0
          FAILURES=0
          for f in out/linhas-*.geojson; do
            [ -f "$f" ] || continue
            FNAME=$(basename "$f")
            if grep -qxF "$FNAME" out/uploaded.txt 2>/dev/null; then
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            HTTP=$(upload_file "$f" "$FNAME")

            if [ "$HTTP" = "201" ]; then
              COUNT=$((COUNT + 1))
            elif [ "$HTTP" = "422" ]; then
              DUP=$(is_422_already_exists)
              if [ "$DUP" = "yes" ]; then
                echo "INFO: $FNAME ja existe (already_exists), pulando"
                SKIPPED=$((SKIPPED + 1))
              else
                echo "INFO: Release $CURRENT_TAG cheia (422 sem already_exists), criando overflow..."
                switch_overflow
                # Tentar novamente na nova release
                HTTP=$(upload_file "$f" "$FNAME")
                if [ "$HTTP" = "201" ]; then
                  COUNT=$((COUNT + 1))
                else
                  echo "ERRO: $FNAME nao enviado apos overflow (HTTP=$HTTP)"
                  cat /tmp/upresp.json 2>/dev/null | head -c 300 || true
                  FAILURES=$((FAILURES + 1))
                fi
              fi
            else
              echo "AVISO: $FNAME HTTP=$HTTP, aguardando 20s e retentando..."
              sleep 20
              HTTP=$(upload_file "$f" "$FNAME")
              if [ "$HTTP" = "201" ]; then
                COUNT=$((COUNT + 1))
              else
                echo "ERRO: $FNAME nao enviado (HTTP=$HTTP)"
                FAILURES=$((FAILURES + 1))
              fi
            fi

            if [ $(( (COUNT + SKIPPED + FAILURES) % 200 )) -eq 0 ] && [ $((COUNT + SKIPPED + FAILURES)) -gt 0 ]; then
              echo "[$((COUNT + SKIPPED + FAILURES))] Progresso: $COUNT novos, $SKIPPED pulados, $FAILURES falhas | Release atual: $CURRENT_TAG"
              df -h .
            fi
            if [ $(( (COUNT + FAILURES) % 50 )) -eq 0 ] && [ $((COUNT + FAILURES)) -gt 0 ]; then
              echo "Pausa 60s rate limit..."
              sleep 60
            fi
          done
          echo "Upload finalizado: $COUNT novos, $SKIPPED pulados, $FAILURES falhas."
          echo "Releases usadas: ${BASE_TAG} e possivelmente overflows ate ${CURRENT_TAG}"
          [ "$FAILURES" -eq 0 ]
