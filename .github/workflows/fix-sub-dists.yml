name: Fix SUB Distribuidoras

on:
  push:
    paths:
      - '.github/workflows/fix-sub-dists.yml'

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix index.json para distribuidoras com SUB alfanumerico
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="KogaIgor0/markfield-web"
          WORKFLOW="fix-index-json.yml"

          declare -A DISTS=(
            [bdgd-cea-2024]="cea_2024"
            [bdgd-ceee-2024]="ceee_2024"
            [bdgd-cpfl-paulista-2024]="cpfl-paulista_2024"
            [bdgd-cpfl-piratininga-2024]="cpfl-piratininga_2024"
            [bdgd-elektro-2024]="elektro_2024"
            [bdgd-enel-sp-2024]="enel-sp_2024"
            [bdgd-equatorial-al-2024]="equatorial-al_2024"
            [bdgd-equatorial-ma-2024]="equatorial-ma_2024"
            [bdgd-equatorial-pa-2024]="equatorial-pa_2024"
            [bdgd-equatorial-pi-2024]="equatorial-pi_2024"
          )

          for TAG in "${!DISTS[@]}"; do
            DIST_ID="${DISTS[$TAG]}"
            echo "==> Disparando: $TAG / $DIST_ID"
            gh workflow run "$WORKFLOW" \
              --repo "$REPO" \
              --ref main \
              --field "tag=$TAG" \
              --field "dist_id=$DIST_ID"
            sleep 2
          done

          echo "Todos os workflows disparados."
