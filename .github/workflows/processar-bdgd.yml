name: Processar BDGD

# Roda manualmente (ou pode agendar 1x por ano quando a ANEEL publicar a BDGD nova)
on:
  workflow_dispatch:
    inputs:
      dataset_id:
        description: 'ID do dataset no ArcGIS Hub (opendata.arcgis.com)'
        required: true
        default: '8eaa712a707745adac9948b24e188bd9'   # Neoenergia Elektro 2024
      prefixo:
        description: 'Prefixo dos arquivos de saída (ex: elektro_2024)'
        required: true
        default: 'elektro_2024'
      tag:
        description: 'Tag do Release onde publicar (ex: bdgd-elektro-2024)'
        required: true
        default: 'bdgd-elektro-2024'
      camada_nome:
        description: 'Nome da camada no arquivo de saída (ex: rede_mt, trafos)'
        required: true
        default: 'rede_mt'
      tipo_saida:
        description: 'Tipo de saída: pmtiles (linhas/polígonos grandes) ou geojson (pontos pequenos)'
        required: true
        default: 'pmtiles'

jobs:
  processar:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    permissions:
      contents: write

    steps:
      # -----------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      - name: Instalar GDAL e tippecanoe
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gdal-bin \
            tippecanoe \
            unzip \
            python3
          echo "GDAL: $(ogr2ogr --version)"
          echo "tippecanoe: $(tippecanoe --version)"

      # -----------------------------------------------------------------------
      - name: Diagnosticar dataset e baixar dados
        run: |
          echo "🔍 Consultando metadados do dataset ${{ inputs.dataset_id }}..."
          METADATA=$(curl -sf \
            "https://opendata.arcgis.com/api/v3/datasets/${{ inputs.dataset_id }}" \
            || echo '{}')

          python3 -c "
import json, sys
d = json.loads(sys.argv[1])
attrs = d.get('data', {}).get('attributes', {})
print('Tipo:', attrs.get('layerType', attrs.get('type', 'desconhecido')))
print('Acesso:', attrs.get('access', '?'))
print('Geometria:', attrs.get('geometryType', '?'))
print('Feições:', attrs.get('recordCount', '?'))
fs_url = attrs.get('url', '')
print('Feature Service URL:', fs_url[:120] if fs_url else 'não disponível')
dls = attrs.get('downloads', [])
print('Downloads pré-gerados:', [x.get('format') for x in dls] if dls else 'nenhum')
" "$METADATA" 2>/dev/null || echo "(não foi possível ler metadados)"

          echo ""
          echo "━━━ Tentativa 1: GeoJSON (Hub API v3, EPSG:4326) ━━━"
          HTTP=$(curl -L -s \
            -o bdgd.geojson \
            -w "%{http_code}" \
            "https://opendata.arcgis.com/api/v3/datasets/${{ inputs.dataset_id }}/downloads/data?format=geojson&spatialRefId=4326")
          BYTES=$(stat -c%s bdgd.geojson 2>/dev/null || echo 0)
          echo "HTTP: $HTTP  |  bytes: $BYTES"

          if [ "$HTTP" -ge 200 ] && [ "$HTTP" -lt 300 ] && [ "$BYTES" -gt 1000 ]; then
            echo "✔ GeoJSON baixado com sucesso"
            echo "FORMATO=geojson" >> $GITHUB_ENV
          else
            echo "⚠  GeoJSON falhou ou vazio. Resposta:"
            head -c 300 bdgd.geojson 2>/dev/null || true
            rm -f bdgd.geojson

            echo ""
            echo "━━━ Tentativa 2: FGDB (Hub API v3, EPSG:4326) ━━━"
            HTTP=$(curl -L -s \
              -o bdgd.gdb.zip \
              -w "%{http_code}" \
              "https://opendata.arcgis.com/api/v3/datasets/${{ inputs.dataset_id }}/downloads/data?format=fgdb&spatialRefId=4326")
            BYTES=$(stat -c%s bdgd.gdb.zip 2>/dev/null || echo 0)
            echo "HTTP: $HTTP  |  bytes: $BYTES"

            if [ "$HTTP" -ge 200 ] && [ "$HTTP" -lt 300 ] && [ "$BYTES" -gt 10000 ]; then
              echo "✔ FGDB baixado com sucesso"
              echo "FORMATO=fgdb" >> $GITHUB_ENV
            else
              echo ""
              echo "❌ Todos os formatos falharam."
              echo "   Resposta da última tentativa:"
              head -c 500 bdgd.gdb.zip 2>/dev/null || true
              echo ""
              echo "   Metadados completos do dataset:"
              echo "$METADATA" | python3 -m json.tool 2>/dev/null | head -100
              exit 1
            fi
          fi

      # -----------------------------------------------------------------------
      - name: Processar GeoJSON → saída final
        if: env.FORMATO == 'geojson'
        run: |
          mkdir -p out
          echo "📐 Formato de entrada: GeoJSON"
          echo "   Feições: $(python3 -c "import json; d=json.load(open('bdgd.geojson')); print(len(d.get('features',[])))")"
          ls -lh bdgd.geojson

          if [ "${{ inputs.tipo_saida }}" = "pmtiles" ]; then
            OUT="out/${{ inputs.prefixo }}-${{ inputs.camada_nome }}.pmtiles"
            echo "→ PMTiles: $OUT"
            tippecanoe \
              --output="$OUT" \
              --minimum-zoom=10 \
              --maximum-zoom=16 \
              --simplification=4 \
              --force \
              --read-parallel \
              -l "${{ inputs.camada_nome }}" \
              bdgd.geojson
          else
            OUT="out/${{ inputs.prefixo }}-${{ inputs.camada_nome }}.geojson"
            echo "→ GeoJSON: $OUT"
            # reprojetar para EPSG:4326 caso necessário
            ogr2ogr -t_srs EPSG:4326 -f GeoJSON -lco RFC7946=YES "$OUT" bdgd.geojson
          fi

          ls -lh out/

      # -----------------------------------------------------------------------
      - name: Extrair .gdb e processar
        if: env.FORMATO == 'fgdb'
        run: |
          mkdir -p out
          echo "📐 Formato de entrada: File Geodatabase"
          unzip -q bdgd.gdb.zip
          GDB=$(find . -maxdepth 2 -name "*.gdb" -type d | head -1)
          echo "GDB encontrado: $GDB"
          echo "Camadas disponíveis:"
          ogrinfo -al -so "$GDB" 2>/dev/null | grep "^Layer name:" | awk '{print "  •", $NF}' || true

          # Usa o nome da camada como o nome do dataset Hub (SSDMT, UNTRMT etc)
          # Aqui assumimos camada = primeira camada disponível no GDB
          CAMADA=$(ogrinfo -al -so "$GDB" 2>/dev/null | grep "^Layer name:" | head -1 | awk '{print $NF}')
          echo "Processando camada: $CAMADA"

          if [ "${{ inputs.tipo_saida }}" = "pmtiles" ]; then
            OUT="out/${{ inputs.prefixo }}-${{ inputs.camada_nome }}.pmtiles"
            ogr2ogr -t_srs EPSG:4326 -f GeoJSON -lco RFC7946=YES /vsistdout/ "$GDB" "$CAMADA" 2>/dev/null \
            | tippecanoe \
                --output="$OUT" \
                --minimum-zoom=10 \
                --maximum-zoom=16 \
                --simplification=4 \
                --force --read-parallel \
                -l "${{ inputs.camada_nome }}" \
                /dev/stdin
          else
            OUT="out/${{ inputs.prefixo }}-${{ inputs.camada_nome }}.geojson"
            ogr2ogr -t_srs EPSG:4326 -f GeoJSON -lco RFC7946=YES "$OUT" "$GDB" "$CAMADA" 2>/dev/null
          fi

          ls -lh out/
          rm -rf bdgd.gdb.zip "$GDB"

      # -----------------------------------------------------------------------
      - name: Publicar no GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: "BDGD ${{ inputs.prefixo }}"
          body: |
            Dados BDGD (ANEEL) processados automaticamente.

            **Dataset:** `${{ inputs.dataset_id }}`
            **Camada:** `${{ inputs.camada_nome }}`
            **Tipo de saída:** `${{ inputs.tipo_saida }}`
            **Gerado em:** ${{ github.run_id }}

            Para usar no Markfield, copie as URLs dos arquivos abaixo
            e cole em `src/map/bdgd.ts` → `BDGD_FONTES[...].urls`.
          files: out/*
          make_latest: false
