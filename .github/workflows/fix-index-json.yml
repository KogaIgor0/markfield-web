name: Fix Index JSON

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag do Release principal (ex: bdgd-cemig-2024)'
        required: true
      dist_id:
        description: 'ID da distribuidora (ex: cemig_2024)'
        required: true

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Listar assets dos releases de linhas
        run: |
          set -euo pipefail
          BASE_TAG="${{ inputs.tag }}"
          mkdir -p /tmp/pages
          FILE_NUM=1
          SUFFIXES=("" "-b" "-c" "-d" "-e")
          for SUFFIX in "${SUFFIXES[@]}"; do
            LINHAS_TAG="${BASE_TAG}${SUFFIX}"
            echo "Tentando tag: $LINHAS_TAG"
            RELEASE_JSON=$(curl -sf \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/KogaIgor0/markfield-web/releases/tags/${LINHAS_TAG}" 2>/dev/null) || continue
            RELEASE_ID=$(echo "$RELEASE_JSON" | jq -r '.id')
            echo "Release ID: $RELEASE_ID (tag $LINHAS_TAG)"
            PAGE=1
            while true; do
              curl -sf \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                "https://api.github.com/repos/KogaIgor0/markfield-web/releases/${RELEASE_ID}/assets?per_page=100&page=${PAGE}" \
                -o "/tmp/pages/file_${FILE_NUM}_page_${PAGE}.json"
              COUNT=$(jq 'length' "/tmp/pages/file_${FILE_NUM}_page_${PAGE}.json")
              echo "  Page $PAGE: $COUNT assets"
              if [ "$COUNT" -lt 100 ]; then break; fi
              PAGE=$((PAGE + 1))
            done
            FILE_NUM=$((FILE_NUM + 1))
          done
          jq -s 'add' /tmp/pages/file_*.json | jq '{assets: .}' > assets_raw.json
          TOTAL=$(jq '.assets | length' assets_raw.json)
          echo "Total: $TOTAL assets"
          echo "OK: assets_raw.json saved"

      - name: Baixar trafos para agrupamento por SUB
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRAFOS_TAG: ${{ inputs.tag }}-trafos
        run: |
          cat > /tmp/build_sub_map.py << 'PYEOF'
import json, os, sys, urllib.request, concurrent.futures

token = os.environ.get('GH_TOKEN', '')
trafos_tag = os.environ.get('TRAFOS_TAG', '')
repo = 'KogaIgor0/markfield-web'
headers = {'Authorization': f'token {token}', 'Accept': 'application/vnd.github+json'}

def gh_get(url):
    req = urllib.request.Request(url, headers=headers)
    with urllib.request.urlopen(req) as r:
        return json.loads(r.read())

try:
    release = gh_get(f'https://api.github.com/repos/{repo}/releases/tags/{trafos_tag}')
except Exception as e:
    print(f'Release trafos nao encontrado: {e} — pulando')
    sys.exit(0)

assets = [a for a in release.get('assets', []) if a['name'].startswith('trafos-')]
print(f'Assets de trafos: {len(assets)}')
if not assets:
    print('Nenhum asset de trafos — pulando')
    sys.exit(0)

ctmt_sub = {}
errors = 0

def baixar_asset(asset):
    asset_id = asset['id']
    name = asset['name']
    try:
        req = urllib.request.Request(
            f'https://api.github.com/repos/{repo}/releases/assets/{asset_id}',
            headers={**headers, 'Accept': 'application/octet-stream'}
        )
        with urllib.request.urlopen(req) as r:
            data = json.loads(r.read())
        for feat in data.get('features', []):
            props = feat.get('properties', {})
            ctmt = str(props.get('CTMT', '')).strip()
            sub = str(props.get('SUB', '')).strip()
            if ctmt and sub:
                return ctmt, sub
    except Exception as e:
        pass
    return None, None

with concurrent.futures.ThreadPoolExecutor(max_workers=30) as executor:
    for ctmt, sub in executor.map(baixar_asset, assets):
        if ctmt and sub:
            ctmt_sub[ctmt] = sub
        else:
            errors += 1

print(f'Mapeamento CTMT->SUB: {len(ctmt_sub)} entradas ({errors} erros/vazios)')
util = any(s and not s.lstrip('-').isdigit() for s in ctmt_sub.values())
print(f'SUB alfanumerico util: {util}')
if ctmt_sub:
    print(f'Exemplo: {list(ctmt_sub.items())[:5]}')
with open('ctmt_sub_map.json', 'w') as f:
    json.dump({'map': ctmt_sub, 'useful': util}, f)
PYEOF
          python3 /tmp/build_sub_map.py

      - name: Gerar index.json
        env:
          INPUT_DIST_ID: ${{ inputs.dist_id }}
        run: |
          python3 - << 'PYEOF'
          import json, re, os, sys
          from collections import defaultdict

          dist_id = os.environ.get('INPUT_DIST_ID', '')
          clean_id = re.sub(r'_[0-9]+$', '', dist_id)
          print(f'dist_id={dist_id} clean_id={clean_id}')

          with open('assets_raw.json') as f:
              data = json.load(f)

          assets = data.get('assets', [])
          print(f'assets: {len(assets)}')
          if not assets:
              print('ERROR: no assets')
              sys.exit(1)

          ctmts = []
          for a in assets:
              m = re.match(r'^linhas-(.+)\.geojson$', a['name'])
              if m:
                  ctmts.append(m.group(1))

          print(f'ctmts: {len(ctmts)}')
          if not ctmts:
              print('ERROR: no ctmts')
              sys.exit(1)

          # Tenta usar mapeamento CTMT→SUB dos trafos (quando disponível e útil)
          ctmt_sub = {}
          use_sub = False
          if os.path.exists('ctmt_sub_map.json'):
              with open('ctmt_sub_map.json') as f:
                  sub_data = json.load(f)
              use_sub = sub_data.get('useful', False)
              if use_sub:
                  ctmt_sub = sub_data.get('map', {})
                  print(f'Usando SUB dos trafos para agrupamento ({len(ctmt_sub)} mapeamentos)')

          index = defaultdict(list)
          for ctmt in sorted(ctmts):
              if use_sub and ctmt in ctmt_sub:
                  sub = ctmt_sub[ctmt]
              elif '_' in ctmt:
                  sub = ctmt.split('_')[0]
              else:
                  m2 = re.match(r'^[A-Z]+', ctmt)
                  sub = m2.group() if m2 else ctmt
              index[sub].append(ctmt)

          result = {'distribuidora': clean_id, 'alimentadores': dict(index)}
          with open('index.json', 'w') as f:
              json.dump(result, f)
          total = sum(len(v) for v in index.values())
          print(f'OK: {total} ctmts in {len(index)} subs')
          PYEOF

      - name: Upload index.json
        env:
          UPLOAD_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          echo "Uploading index.json to release: $TAG"

          RELEASE_JSON=$(curl -sf \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/KogaIgor0/markfield-web/releases/tags/${TAG}")
          RELEASE_ID=$(echo "$RELEASE_JSON" | jq -r '.id')
          UPLOAD_URL=$(echo "$RELEASE_JSON" | jq -r '.upload_url' | sed 's/{?name,label}//')
          echo "Release ID: $RELEASE_ID"
          echo "Upload URL: $UPLOAD_URL"

          EXISTING_ID=$(echo "$RELEASE_JSON" | jq -r '.assets[] | select(.name=="index.json") | .id // empty')
          if [ -n "$EXISTING_ID" ]; then
            echo "Deleting existing index.json asset $EXISTING_ID"
            curl -sf -X DELETE \
              -H "Authorization: token ${UPLOAD_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/KogaIgor0/markfield-web/releases/assets/${EXISTING_ID}"
          fi

          RESULT=$(curl -sf -X POST \
            -H "Authorization: token ${UPLOAD_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "${UPLOAD_URL}?name=index.json" \
            --data-binary "@index.json")
          echo "Uploaded: $(echo "$RESULT" | jq -r '.name + " id=" + (.id|tostring)')"
          echo "Done."
