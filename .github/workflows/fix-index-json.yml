name: Fix Index JSON

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag do Release principal (ex: bdgd-cemig-2024)'
        required: true
      dist_id:
        description: 'ID da distribuidora (ex: cemig_2024)'
        required: true

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Listar assets do release trafos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          python3 - << 'PYEOF'
          import json, os, subprocess, sys

          token = os.environ['GITHUB_TOKEN']
          tag = os.environ['INPUT_TAG'] + '-trafos'
          print('Fetching release:', tag)

          def gh_get(url):
              r = subprocess.run([
                  'curl', '-sf',
                  '-H', 'Authorization: Bearer ' + token,
                  '-H', 'Accept: application/vnd.github.v3+json',
                  url
              ], capture_output=True, text=True)
              if r.returncode != 0:
                  print('curl error:', r.stderr)
                  sys.exit(1)
              d = json.loads(r.stdout)
              if isinstance(d, dict) and 'message' in d:
                  print('API error:', d['message'])
                  sys.exit(1)
              return d

          rel = gh_get(f'https://api.github.com/repos/KogaIgor0/markfield-web/releases/tags/{tag}')
          rid = rel['id']
          print('Release ID:', rid)

          assets = []
          page = 1
          while True:
              page_assets = gh_get(
                  f'https://api.github.com/repos/KogaIgor0/markfield-web/releases/{rid}/assets?per_page=100&page={page}'
              )
              print(f'Page {page}: {len(page_assets)} assets')
              assets.extend(page_assets)
              if len(page_assets) < 100:
                  break
              page += 1

          print(f'Total: {len(assets)} assets')
          json.dump({'assets': assets}, open('assets_raw.json', 'w'))
          print('OK: assets_raw.json saved')
          PYEOF

      - name: Gerar index.json
        env:
          INPUT_DIST_ID: ${{ inputs.dist_id }}
        run: |
          python3 - << 'PYEOF'
          import json, re, os, sys
          from collections import defaultdict

          dist_id = os.environ.get('INPUT_DIST_ID', '')
          clean_id = re.sub(r'_[0-9]+$', '', dist_id)
          print(f'dist_id={dist_id} clean_id={clean_id}')

          with open('assets_raw.json') as f:
              data = json.load(f)

          assets = data.get('assets', [])
          print(f'assets: {len(assets)}')
          if not assets:
              print('ERROR: no assets')
              sys.exit(1)

          ctmts = []
          for a in assets:
              m = re.match(r'^trafos-(.+)\.geojson$', a['name'])
              if m:
                  ctmts.append(m.group(1))

          print(f'ctmts: {len(ctmts)}')
          if not ctmts:
              print('ERROR: no ctmts')
              sys.exit(1)

          index = defaultdict(list)
          for ctmt in sorted(ctmts):
              if '_' in ctmt:
                  sub = ctmt.split('_')[0]
              else:
                  m2 = re.match(r'^[A-Z]+', ctmt)
                  sub = m2.group() if m2 else ctmt
              index[sub].append(ctmt)

          result = {'distribuidora': clean_id, 'alimentadores': dict(index)}
          with open('index.json', 'w') as f:
              json.dump(result, f)
          total = sum(len(v) for v in index.values())
          print(f'OK: {total} ctmts in {len(index)} subs')
          PYEOF

      - name: Upload index.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Uploading to ${{ inputs.tag }}"
          gh release upload "${{ inputs.tag }}" index.json \
            --clobber \
            --repo KogaIgor0/markfield-web
          echo "Done."
