name: Fix Index JSON

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag do Release principal (ex: bdgd-cemig-2024)'
        required: true
      dist_id:
        description: 'ID da distribuidora (ex: cemig_2024)'
        required: true

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Gerar index.json a partir dos assets do release trafos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TRAFOS_TAG="${{ inputs.tag }}-trafos"
          echo "Buscando assets do release $TRAFOS_TAG..."

          # Use curl to list all assets (API paginates at 100; one page is enough)
          curl -s \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/KogaIgor0/markfield-web/releases/tags/$TRAFOS_TAG" \
            | python3 -c "
import json, sys, re
from collections import defaultdict

dist_id = '${{ inputs.dist_id }}'
clean_id = re.sub(r'_[0-9]+$', '', dist_id)

data = json.load(sys.stdin)
assets = data.get('assets', [])
print(f'Assets no release trafos: {len(assets)}')

if not assets:
    print('ERRO: nenhum asset encontrado no release trafos!')
    sys.exit(1)

ctmts = []
for a in assets:
    m = re.match(r'^trafos-(.+)\.geojson$', a['name'])
    if m:
        ctmts.append(m.group(1))

print(f'CTMTs extraidos: {len(ctmts)}')

if not ctmts:
    print('ERRO: nenhum CTMT encontrado!')
    sys.exit(1)

index = defaultdict(list)
for ctmt in sorted(ctmts):
    if '_' in ctmt:
        sub = ctmt.split('_')[0]
    else:
        m2 = re.match(r'^[A-Z]+', ctmt)
        sub = m2.group() if m2 else ctmt
    index[sub].append(ctmt)

result = {'distribuidora': clean_id, 'alimentadores': dict(index)}
with open('index.json', 'w') as f:
    json.dump(result, f)

total = sum(len(v) for v in index.values())
print(f'index.json: {total} CTMTs em {len(index)} subestacoes')
print(f'Distribuidora: {clean_id}')
"

      - name: Upload index.json para release principal
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Fazendo upload do index.json para ${{ inputs.tag }}..."
          gh release upload "${{ inputs.tag }}" index.json \
            --clobber \
            --repo KogaIgor0/markfield-web
          echo "index.json atualizado com sucesso."
