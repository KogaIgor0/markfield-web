name: Fix Index JSON

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag do Release principal (ex: bdgd-cemig-2024)'
        required: true
      dist_id:
        description: 'ID da distribuidora (ex: cemig_2024)'
        required: true

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Listar assets do release trafos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TRAFOS_TAG="${{ inputs.tag }}-trafos"
          echo "Fetching release: $TRAFOS_TAG"

          RELEASE=$(curl -sf \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/KogaIgor0/markfield-web/releases/tags/$TRAFOS_TAG")

          RELEASE_ID=$(echo "$RELEASE" | jq -r '.id')
          echo "Release ID: $RELEASE_ID"

          ALL_ASSETS='[]'
          PAGE=1
          while true; do
            PAGE_DATA=$(curl -sf \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/KogaIgor0/markfield-web/releases/$RELEASE_ID/assets?per_page=100&page=$PAGE")
            COUNT=$(echo "$PAGE_DATA" | jq 'length')
            echo "Page $PAGE: $COUNT assets"
            ALL_ASSETS=$(jq -n --argjson a "$ALL_ASSETS" --argjson b "$PAGE_DATA" '$a + $b')
            if [ "$COUNT" -lt 100 ]; then break; fi
            PAGE=$((PAGE + 1))
          done

          TOTAL=$(echo "$ALL_ASSETS" | jq 'length')
          echo "Total: $TOTAL assets"
          echo "$ALL_ASSETS" | jq '{assets: .}' > assets_raw.json
          echo "OK: assets_raw.json saved"

      - name: Gerar index.json
        env:
          INPUT_DIST_ID: ${{ inputs.dist_id }}
        run: |
          python3 - << 'PYEOF'
          import json, re, os, sys
          from collections import defaultdict

          dist_id = os.environ.get('INPUT_DIST_ID', '')
          clean_id = re.sub(r'_[0-9]+$', '', dist_id)
          print(f'dist_id={dist_id} clean_id={clean_id}')

          with open('assets_raw.json') as f:
              data = json.load(f)

          assets = data.get('assets', [])
          print(f'assets: {len(assets)}')
          if not assets:
              print('ERROR: no assets')
              sys.exit(1)

          ctmts = []
          for a in assets:
              m = re.match(r'^trafos-(.+)\.geojson$', a['name'])
              if m:
                  ctmts.append(m.group(1))

          print(f'ctmts: {len(ctmts)}')
          if not ctmts:
              print('ERROR: no ctmts')
              sys.exit(1)

          index = defaultdict(list)
          for ctmt in sorted(ctmts):
              if '_' in ctmt:
                  sub = ctmt.split('_')[0]
              else:
                  m2 = re.match(r'^[A-Z]+', ctmt)
                  sub = m2.group() if m2 else ctmt
              index[sub].append(ctmt)

          result = {'distribuidora': clean_id, 'alimentadores': dict(index)}
          with open('index.json', 'w') as f:
              json.dump(result, f)
          total = sum(len(v) for v in index.values())
          print(f'OK: {total} ctmts in {len(index)} subs')
          PYEOF

      - name: Upload index.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          echo "Uploading index.json to $TAG"

          RELEASE=$(curl -sf \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/KogaIgor0/markfield-web/releases/tags/$TAG")

          RELEASE_ID=$(echo "$RELEASE" | jq -r '.id')
          UPLOAD_URL=$(echo "$RELEASE" | jq -r '.upload_url' | sed 's/{.*//')
          echo "Release ID: $RELEASE_ID  Upload URL: $UPLOAD_URL"

          # Clobber: delete existing index.json if present
          EXISTING_ID=$(echo "$RELEASE" | jq -r '.assets[] | select(.name=="index.json") | .id' || true)
          if [ -n "$EXISTING_ID" ]; then
            echo "Deleting existing index.json (id=$EXISTING_ID)"
            curl -sf -X DELETE \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/KogaIgor0/markfield-web/releases/assets/$EXISTING_ID"
          fi

          # Upload
          RESULT=$(curl -sf \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            "$UPLOAD_URL?name=index.json" \
            --data-binary @index.json)

          echo "Uploaded: $(echo "$RESULT" | jq -r '.name') ($(echo "$RESULT" | jq -r '.size') bytes)"
          echo "Done."
