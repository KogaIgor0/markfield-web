name: Fix Index JSON

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag do Release principal (ex: bdgd-cemig-2024)'
        required: true
      dist_id:
        description: 'ID da distribuidora (ex: cemig_2024)'
        required: true

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Gerar index.json a partir dos assets do release trafos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TRAFOS_TAG="${{ inputs.tag }}-trafos"
          DIST_ID="${{ inputs.dist_id }}"
          echo "Tag trafos: $TRAFOS_TAG"
          echo "Dist ID: $DIST_ID"
          gh api "repos/KogaIgor0/markfield-web/releases/tags/$TRAFOS_TAG" > release_data.json 2>&1
          echo "Exit code gh api: $?"
          head -c 200 release_data.json
          echo ""
          ASSET_COUNT=$(python3 -c "import json; d=json.load(open('release_data.json')); print(len(d.get('assets',[])))" 2>&1)
          echo "Assets: $ASSET_COUNT"
          python3 - "$DIST_ID" << 'PYEOF'
          import json, sys, re
          from collections import defaultdict

          dist_id = sys.argv[1]
          clean_id = re.sub(r'_[0-9]+$', '', dist_id)

          with open('release_data.json') as f:
              data = json.load(f)

          assets = data.get('assets', [])
          print(f'Total assets: {len(assets)}', flush=True)
          if not assets:
              print('ERRO: nenhum asset encontrado!')
              sys.exit(1)

          ctmts = []
          for a in assets:
              m = re.match(r'^trafos-(.+)\.geojson$', a['name'])
              if m:
                  ctmts.append(m.group(1))

          print(f'CTMTs: {len(ctmts)}', flush=True)
          if not ctmts:
              print('ERRO: nenhum CTMT encontrado!')
              sys.exit(1)

          index = defaultdict(list)
          for ctmt in sorted(ctmts):
              if '_' in ctmt:
                  sub = ctmt.split('_')[0]
              else:
                  m2 = re.match(r'^[A-Z]+', ctmt)
                  sub = m2.group() if m2 else ctmt
              index[sub].append(ctmt)

          result = {'distribuidora': clean_id, 'alimentadores': dict(index)}
          with open('index.json', 'w') as f:
              json.dump(result, f)

          total = sum(len(v) for v in index.values())
          print(f'OK: {total} CTMTs em {len(index)} subestacoes, dist={clean_id}')
          PYEOF

      - name: Upload index.json para release principal
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Upload index.json para ${{ inputs.tag }}..."
          gh release upload "${{ inputs.tag }}" index.json \
            --clobber \
            --repo KogaIgor0/markfield-web
          echo "Sucesso."
