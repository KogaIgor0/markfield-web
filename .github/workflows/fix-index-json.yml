name: Fix Index JSON

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag do Release principal (ex: bdgd-cemig-2024)'
        required: true
      dist_id:
        description: 'ID da distribuidora (ex: cemig_2024)'
        required: true

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and upload index.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DIST_ID: ${{ inputs.dist_id }}
        run: |
          TRAFOS_TAG="${INPUT_TAG}-trafos"
          echo "Fetching assets from release $TRAFOS_TAG"
          gh release view "$TRAFOS_TAG" \
            --repo KogaIgor0/markfield-web \
            --json assets \
            > assets_raw.json
          echo "Assets fetched, size=$(wc -c < assets_raw.json)"
          python3 <<'SCRIPT'
          import json, re, os, sys
          from collections import defaultdict

          dist_id = os.environ['INPUT_DIST_ID']
          clean_id = re.sub(r'_[0-9]+$', '', dist_id)

          with open('assets_raw.json') as f:
              data = json.load(f)

          assets = data.get('assets', [])
          print(f'Total assets: {len(assets)}')
          if not assets:
              print('ERROR: no assets found')
              sys.exit(1)

          ctmts = []
          for a in assets:
              m = re.match(r'^trafos-(.+)\.geojson$', a['name'])
              if m:
                  ctmts.append(m.group(1))

          print(f'CTMTs found: {len(ctmts)}')
          if not ctmts:
              print('ERROR: no CTMTs found')
              sys.exit(1)

          index = defaultdict(list)
          for ctmt in sorted(ctmts):
              if '_' in ctmt:
                  sub = ctmt.split('_')[0]
              else:
                  m2 = re.match(r'^[A-Z]+', ctmt)
                  sub = m2.group() if m2 else ctmt
              index[sub].append(ctmt)

          result = {'distribuidora': clean_id, 'alimentadores': dict(index)}
          with open('index.json', 'w') as f:
              json.dump(result, f)

          total = sum(len(v) for v in index.values())
          print(f'index.json written: {total} CTMTs in {len(index)} subestacoes, dist={clean_id}')
          SCRIPT
          echo "Uploading index.json to release $INPUT_TAG"
          gh release upload "$INPUT_TAG" index.json \
            --clobber \
            --repo KogaIgor0/markfield-web
          echo "Upload complete."
