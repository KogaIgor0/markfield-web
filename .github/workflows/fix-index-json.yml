name: Fix Index JSON

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag do Release principal (ex: bdgd-cemig-2024)'
        required: true
      dist_id:
        description: 'ID da distribuidora (ex: cemig_2024)'
        required: true

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Listar assets do release trafos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TRAFOS_TAG="${{ inputs.tag }}-trafos"
          echo "Tag: $TRAFOS_TAG"

          RELEASE_ID=$(gh api \
            "repos/KogaIgor0/markfield-web/releases/tags/$TRAFOS_TAG" \
            --jq '.id')
          echo "Release ID: $RELEASE_ID"

          ALL_ASSETS='[]'
          PAGE=1
          while true; do
            PAGE_DATA=$(gh api \
              "repos/KogaIgor0/markfield-web/releases/$RELEASE_ID/assets?per_page=100&page=$PAGE")
            COUNT=$(echo "$PAGE_DATA" | jq 'length')
            echo "Page $PAGE: $COUNT assets"
            ALL_ASSETS=$(jq -n --argjson a "$ALL_ASSETS" --argjson b "$PAGE_DATA" '$a + $b')
            if [ "$COUNT" -lt 100 ]; then break; fi
            PAGE=$((PAGE + 1))
          done

          TOTAL=$(echo "$ALL_ASSETS" | jq 'length')
          echo "Total: $TOTAL assets"
          echo "$ALL_ASSETS" | jq '{assets: .}' > assets_raw.json
          echo "OK: assets_raw.json saved"

      - name: Gerar index.json
        env:
          INPUT_DIST_ID: ${{ inputs.dist_id }}
        run: |
          python3 - << 'PYEOF'
          import json, re, os, sys
          from collections import defaultdict

          dist_id = os.environ.get('INPUT_DIST_ID', '')
          clean_id = re.sub(r'_[0-9]+$', '', dist_id)
          print(f'dist_id={dist_id} clean_id={clean_id}')

          with open('assets_raw.json') as f:
              data = json.load(f)

          assets = data.get('assets', [])
          print(f'assets: {len(assets)}')
          if not assets:
              print('ERROR: no assets')
              sys.exit(1)

          ctmts = []
          for a in assets:
              m = re.match(r'^trafos-(.+)\.geojson$', a['name'])
              if m:
                  ctmts.append(m.group(1))

          print(f'ctmts: {len(ctmts)}')
          if not ctmts:
              print('ERROR: no ctmts')
              sys.exit(1)

          index = defaultdict(list)
          for ctmt in sorted(ctmts):
              if '_' in ctmt:
                  sub = ctmt.split('_')[0]
              else:
                  m2 = re.match(r'^[A-Z]+', ctmt)
                  sub = m2.group() if m2 else ctmt
              index[sub].append(ctmt)

          result = {'distribuidora': clean_id, 'alimentadores': dict(index)}
          with open('index.json', 'w') as f:
              json.dump(result, f)
          total = sum(len(v) for v in index.values())
          print(f'OK: {total} ctmts in {len(index)} subs')
          PYEOF

      - name: Upload index.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          echo "Uploading index.json to $TAG"
          gh release upload "$TAG" index.json \
            --clobber \
            --repo KogaIgor0/markfield-web
          echo "Done."
